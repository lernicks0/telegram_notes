# Lernicks 全站 Nginx 配置
# Cloudflare 使用 Flexible 模式，所以源站只监听 80 端口。

server {
    listen 80;
    server_name lernicks.cn www.lernicks.cn;

    location / {
        proxy_pass http://127.0.0.1:1149;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name note.lernicks.cn;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name tbl.lernicks.cn;
    client_max_body_size 11m;

    location / {
        proxy_pass http://127.0.0.1:1148;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

