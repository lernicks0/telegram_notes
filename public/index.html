<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="/favicon.png" />
<title>便签电报 · Notes</title>
<style>
  :root{
    --ink: #12203a;
    --paper: #f4ecd8;
    --text-dark: #241d12;
    --text-light: #eee6d3;
    --muted: #7c8aa3;
    --teal: #3f7d76;
    --teal-dark: #2c5b56;
    --seal: #a13d33;
    --seal-dark: #7e2e26;
    --font-display: 'Courier New', 'Consolas', monospace;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --font-mono: 'Consolas', 'Courier New', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background: var(--ink);
    color: var(--text-light);
    font-family: var(--font-body);
  }
  #app{min-height:100vh; display:flex; flex-direction:column; align-items:center;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;}
  input, textarea{font-family:inherit;}

  .topnav{width:100%; display:flex; justify-content:space-between; align-items:center; padding:22px 32px; letter-spacing:0.08em; font-size:13px; text-transform:uppercase; color:var(--muted);}
  .topnav .brand{font-family:var(--font-display); color:var(--text-light); font-size:14px; letter-spacing:0.12em;}
  .topnav .brand b{color:#e7b98f;}
  .topnav nav a{margin-left:22px; transition:color .15s;}
  .topnav nav a:hover{color:var(--text-light);}

  .home-wrap{flex:1; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px 100px;}
  .telegram-title{font-family:var(--font-display); font-size:clamp(28px,5vw,46px); text-align:center; margin:0 0 6px; color:var(--text-light);}
  .telegram-sub{color:var(--muted); font-size:14px; text-align:center; max-width:440px; line-height:1.7; margin-bottom:40px;}
  .telegram-card{background:var(--paper); color:var(--text-dark); width:min(460px,92vw); padding:34px 30px 28px; position:relative; box-shadow:0 30px 60px -20px rgba(0,0,0,0.55); border-radius:2px;}
  .perforation{position:absolute; top:0; left:0; right:0; height:14px; background-image:radial-gradient(circle 7px, var(--ink) 7px, transparent 7.5px); background-size:28px 28px; background-position:14px -7px; background-repeat:repeat-x;}
  .telegram-card label{display:block; font-family:var(--font-mono); font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#6b6250; margin-bottom:8px; margin-top:18px;}
  .slug-input{width:100%; border:none; border-bottom:2px solid #c9bd9c; background:transparent; font-size:20px; font-family:var(--font-mono); padding:6px 2px; color:var(--text-dark); outline:none;}
  .slug-input:focus{border-color:var(--teal);}
  .go-btn{margin-top:26px; width:100%; background:var(--ink); color:var(--text-light); padding:14px; font-size:14px; letter-spacing:0.14em; text-transform:uppercase; font-family:var(--font-mono); border-radius:1px; transition:transform .12s, background .15s;}
  .go-btn:hover{background:var(--teal-dark); transform:translateY(-1px);}
  .home-hint{margin-top:22px; color:var(--muted); font-size:12.5px; text-align:center; max-width:400px; line-height:1.6;}

  .note-wrap{flex:1; width:100%; display:flex; flex-direction:column; align-items:center; padding:0 0 60px;}
  .note-bar{width:min(880px,94vw); display:flex; align-items:center; justify-content:space-between; padding:18px 4px 14px; flex-wrap:wrap; gap:10px;}
  .postmark{font-family:var(--font-mono); font-size:13px; color:var(--text-light); border:1px dashed var(--muted); padding:6px 12px; border-radius:20px; display:flex; align-items:center; gap:8px;}
  .postmark .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);}
  .note-actions{display:flex; gap:10px; align-items:center;}
  .icon-btn{background:rgba(255,255,255,0.06); color:var(--text-light); padding:9px 14px; border-radius:20px; font-size:12.5px; display:flex; align-items:center; gap:6px; transition:background .15s;}
  .icon-btn:hover{background:rgba(255,255,255,0.14);}
  .icon-btn.seal{background:var(--seal);}
  .icon-btn.seal:hover{background:var(--seal-dark);}
  .icon-btn.seal.off{background:rgba(255,255,255,0.06);}
  .icon-btn.seal.off:hover{background:rgba(255,255,255,0.14);}

  .paper-page{width:min(880px,94vw); background:var(--paper); position:relative; min-height:60vh; box-shadow:0 30px 60px -20px rgba(0,0,0,0.55); border-radius:2px;}
  .paper-page textarea{width:100%; min-height:60vh; border:none; outline:none; background:transparent; resize:vertical; padding:40px 44px 30px; font-size:17px; line-height:1.85; color:var(--text-dark); font-family:var(--font-body);}
  .save-status{position:absolute; bottom:12px; right:20px; font-family:var(--font-mono); font-size:11px; color:#8a806a;}

  .settings-panel{width:min(880px,94vw); background:rgba(255,255,255,0.05); border-radius:4px; margin-top:14px; padding:20px 22px; font-size:13.5px; color:var(--text-light); display:none;}
  .settings-panel.open{display:block;}
  .settings-panel .row{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .settings-panel input[type=text]{background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); color:var(--text-light); padding:9px 12px; border-radius:4px; font-size:13.5px; outline:none; flex:1;}
  .settings-panel button.apply{background:var(--teal); color:#fff; padding:9px 16px; border-radius:4px; font-size:13px;}
  .settings-panel button.apply:hover{background:var(--teal-dark);}
  .settings-note{color:var(--muted); font-size:12px; line-height:1.6; margin-top:6px;}

  .gate-wrap{flex:1; width:100%; display:flex; align-items:center; justify-content:center; padding:40px 20px;}
  .gate-card{background:var(--paper); color:var(--text-dark); width:min(400px,90vw); padding:36px 30px; text-align:center; border-radius:2px; box-shadow:0 30px 60px -20px rgba(0,0,0,0.55); position:relative;}
  .wax-seal{width:60px; height:60px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #c25445, var(--seal-dark)); margin:-66px auto 20px; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 18px rgba(0,0,0,0.4); font-size:22px;}
  .gate-card h3{font-family:var(--font-display); margin:0 0 6px; font-size:20px;}
  .gate-card p{color:#6b6250; font-size:13px; margin-bottom:20px;}
  .gate-card input{width:100%; border:none; border-bottom:2px solid #c9bd9c; background:transparent; padding:8px 2px; font-size:16px; text-align:center; outline:none; margin-bottom:18px;}
  .gate-card input:focus{border-color:var(--teal);}
  .gate-error{color:var(--seal); font-size:12.5px; margin-top:-10px; margin-bottom:14px; display:none;}

  .fb-wrap{flex:1; width:100%; display:flex; flex-direction:column; align-items:center; padding:20px 20px 80px;}
  .fb-card{background:var(--paper); color:var(--text-dark); width:min(560px,94vw); padding:32px 30px; border-radius:2px; box-shadow:0 30px 60px -20px rgba(0,0,0,0.55); position:relative;}
  .fb-card h2{font-family:var(--font-display); margin:8px 0 4px; font-size:22px;}
  .fb-card p.desc{color:#6b6250; font-size:13px; margin-bottom:22px; line-height:1.6;}
  .fb-card label{display:block; font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:#6b6250; margin-bottom:6px; margin-top:16px;}
  .fb-card input[type=text]{width:100%; border:none; border-bottom:2px solid #c9bd9c; background:transparent; padding:6px 2px; font-size:15px; outline:none;}
  .fb-card textarea{width:100%; border:1px solid #c9bd9c; background:rgba(255,255,255,0.4); padding:10px; font-size:14.5px; line-height:1.6; min-height:110px; outline:none; border-radius:2px; resize:vertical;}
  .fb-submit{margin-top:20px;}
  .fb-msg{font-size:12.5px; color:var(--teal-dark); margin-top:10px; display:none;}
  .fb-list-wrap{width:min(560px,94vw); margin-top:32px;}
  .fb-list-title{font-family:var(--font-mono); color:var(--muted); font-size:12px; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:14px;}
  .fb-item{background:rgba(255,255,255,0.05); border-radius:4px; padding:14px 16px; margin-bottom:10px; font-size:13.5px; color:var(--text-light);}
  .fb-item .meta{font-family:var(--font-mono); font-size:11px; color:var(--muted); margin-bottom:6px; display:flex; justify-content:space-between;}
  .fb-item .body{line-height:1.6; white-space:pre-wrap; word-break:break-word;}
  .fb-empty{color:var(--muted); font-size:13px; text-align:center; padding:20px 0;}

  @media (max-width:600px){
    .topnav{padding:18px 18px;}
    .paper-page textarea{padding:28px 20px 24px; font-size:16px;}
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  const app = document.getElementById('app');
  const API = ''; // 同源部署;如果前后端分开部署,改成完整的后端地址,例如 'https://api.yourdomain.com'

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function slugify(raw){
    return (raw||'').trim().toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9\-_\u4e00-\u9fa5]/g,'').slice(0,50);
  }
  function timeAgo(ts){
    const diff = Math.max(0, Date.now()-ts);
    const m = Math.floor(diff/60000);
    if(m<1) return '刚刚';
    if(m<60) return m+' 分钟前';
    const h = Math.floor(m/60);
    if(h<24) return h+' 小时前';
    return Math.floor(h/24)+' 天前';
  }
  async function api(path, opts){
    const res = await fetch(API + path, {
      headers: {'Content-Type':'application/json'},
      ...opts,
    });
    let data = null;
    try{ data = await res.json(); }catch(e){}
    return { ok: res.ok, status: res.status, data };
  }
  function nav(hash){ location.hash = hash; }

  function topnavHtml(active){
    return `
      <div class="topnav">
        <a href="#/" class="brand">✎ <b>便签电报</b> / notes</a>
        <nav>
          <a href="#/" style="${active==='home'?'color:#eee6d3':''}">首页</a>
          <a href="#/feedback" style="${active==='fb'?'color:#eee6d3':''}">问题反馈</a>
        </nav>
      </div>
    `;
  }

  // ---------------- HOME ----------------
  function renderHome(){
    app.innerHTML = `
      ${topnavHtml('home')}
      <div class="home-wrap">
        <h1 class="telegram-title">写点什么,发给需要的人</h1>
        <p class="telegram-sub">起一个只有你们知道的名字,内容即刻保存。可选择加一道密码,作为访问门槛。</p>
        <div class="telegram-card">
          <div class="perforation"></div>
          <label>笔记代号 · Note ID</label>
          <div style="display:flex;gap:8px;">
            <input class="slug-input" id="slugInput" placeholder="例如 mynote-2026" autocomplete="off" style="flex:1;" />
            <button style="background:var(--teal);color:#fff;padding:6px 14px;border-radius:2px;font-size:14px;cursor:pointer;border:none;font-family:var(--font-body);display:flex;align-items:center;gap:6px;white-space:nowrap;" id="randomBtn">🎲 随机</button>
          </div>
          <button class="go-btn" id="goBtn">打开 / 创建</button>
        </div>
        <p class="home-hint">提示:密码仅作为访问门槛,内容并未端到端加密,请勿存放高度敏感信息。</p>
      </div>
    `;
    const input = document.getElementById('slugInput');
    const go = () => {
      const s = slugify(input.value);
      if(!s){ input.focus(); return; }
      nav('#/n/'+encodeURIComponent(s));
    };
    document.getElementById('randomBtn').onclick = ()=>{
      const words = ['memo','idea','note','diary','draft','page','jot','log','vibe','word','ink','stamp','seal','clip','pins','tag','dash','flow','echo','spark'];
      const w = words[Math.floor(Math.random()*words.length)];
      const n = Math.random().toString(36).substring(2,5);
      input.value = w+'-'+n;
      input.focus();
    };
    document.getElementById('goBtn').onclick = go;
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
    input.focus();
  }

  // ---------------- NOTE PAGE ----------------
  async function renderNote(slug){
    app.innerHTML = `${topnavHtml('')}<div id="noteRoot"></div>`;
    const root = document.getElementById('noteRoot');
    root.innerHTML = `<div class="gate-wrap"><p style="color:#7c8aa3;">加载中…</p></div>`;

    const meta = await api('/api/notes/'+encodeURIComponent(slug)+'/meta');
    if(!meta.ok){
      root.innerHTML = `<div class="gate-wrap"><p style="color:#7c8aa3;">加载失败,请检查后端服务是否运行</p></div>`;
      return;
    }
    if(meta.data.exists && meta.data.hasPassword){
      renderGate(root, slug);
    } else {
      const r = await api('/api/notes/'+encodeURIComponent(slug));
      const content = (r.ok && r.data.content) ? r.data.content : '';
      renderEditor(root, slug, { content, hasPassword:false, token:null });
    }
  }

  function renderGate(root, slug){
    root.innerHTML = `
      <div class="gate-wrap">
        <div class="gate-card">
          <div class="wax-seal">🔒</div>
          <h3>${escapeHtml(slug)}</h3>
          <p>这份笔记设有密码,请输入以继续</p>
          <input type="password" id="pwInput" placeholder="密码" />
          <p class="gate-error" id="pwErr">密码不正确,请再试一次</p>
          <button class="go-btn" id="pwGo">解锁</button>
        </div>
      </div>
    `;
    const input = document.getElementById('pwInput');
    const err = document.getElementById('pwErr');
    const submit = async () => {
      const r = await api('/api/notes/'+encodeURIComponent(slug)+'/unlock', {
        method:'POST', body: JSON.stringify({ password: input.value })
      });
      if(r.ok && r.data.ok){
        renderEditor(root, slug, { content: r.data.content, hasPassword:true, token: r.data.token });
      } else {
        err.style.display='block'; input.value=''; input.focus();
      }
    };
    document.getElementById('pwGo').onclick = submit;
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
    input.focus();
  }

  function renderEditor(root, slug, state){
    root.innerHTML = `
      <div class="note-wrap">
        <div class="note-bar">
          <div class="postmark"><span class="dot"></span>${escapeHtml(slug)}</div>
          <div class="note-actions">
            <button class="icon-btn" id="copyLink">🔗 复制链接</button>
            <button class="icon-btn seal ${state.hasPassword?'':'off'}" id="lockBtn">${state.hasPassword?'🔒 已加密':'🔓 无密码'}</button>
            <button class="icon-btn seal" id="destroyBtn" style="background:var(--seal);">🗑️ 销毁</button>
          </div>
        </div>
        <div class="paper-page">
          <textarea id="editorArea" placeholder="开始写下你想说的话…">${escapeHtml(state.content||'')}</textarea>
          <div class="save-status" id="saveStatus">已保存</div>
        </div>
        <div class="settings-panel" id="settingsPanel">
          <div class="row" id="pwRow" style="display:${state.hasPassword? 'none':'flex'};">
            <input type="text" id="newPw" placeholder="设置访问密码" />
            <button class="apply" id="applyPw">保存设置</button>
          </div>
          <div class="row" id="pwRowChange" style="display:${state.hasPassword?'flex':'none'};">
            <input type="text" id="newPw2" placeholder="输入新密码以更改,留空则移除密码" />
            <button class="apply" id="applyPw2">保存设置</button>
          </div>
          <p class="settings-note">密码以哈希形式保存在服务器上,仅作为打开这份笔记的门槛;请勿用于存放高度敏感信息。</p>
        </div>
      </div>
    `;

    const area = document.getElementById('editorArea');
    const status = document.getElementById('saveStatus');
    let saveTimer = null;
    let token = state.token;

    async function persist(patch){
      status.textContent = '保存中…';
      const body = { content: area.value };
      if(typeof patch.setPassword !== 'undefined') body.setPassword = patch.setPassword;
      if(token) body.token = token;
      const r = await api('/api/notes/'+encodeURIComponent(slug), { method:'PUT', body: JSON.stringify(body) });
      if(r.ok){
        status.textContent = '已保存 · ' + new Date().toLocaleTimeString();
        return r.data;
      } else {
        status.textContent = r.status===401 ? '未授权,请重新解锁后再试' : '保存失败,请重试';
        return null;
      }
    }

    area.addEventListener('input', ()=>{
      status.textContent = '输入中…';
      clearTimeout(saveTimer);
      saveTimer = setTimeout(()=> persist({}), 700);
    });

    document.getElementById('destroyBtn').onclick = async ()=>{
      if(!confirm('确定要销毁笔记「'+slug+'」吗?此操作不可撤销。')) return;
      const body = {};
      if(token) body.token = token;
      const r = await api('/api/notes/'+encodeURIComponent(slug), { method:'DELETE', body: JSON.stringify(body) });
      if(r.ok){
        nav('#/');
      } else if(r.status===401){
        alert('无权限删除,请重新解锁笔记后再试');
      } else {
        alert('删除失败');
      }
    };

    document.getElementById('copyLink').onclick = async (e)=>{
      const url = location.origin + '/#/n/' + encodeURIComponent(slug);
      try{
        await navigator.clipboard.writeText(url);
        e.target.textContent = '✓ 已复制';
        setTimeout(()=> e.target.textContent = '🔗 复制链接', 1500);
      }catch(err){ prompt('复制此链接:', url); }
    };

    const panel = document.getElementById('settingsPanel');
    document.getElementById('lockBtn').onclick = ()=> panel.classList.toggle('open');

    document.getElementById('applyPw').onclick = async ()=>{
      const val = document.getElementById('newPw').value;
      if(!val) return;
      const data = await persist({ setPassword: val });
      if(data){
        // 设置密码后需要重新获取解锁令牌:直接刷新为已解锁状态
        state.hasPassword = true; state.content = area.value;
        renderEditor(root, slug, state); // 注意:此处 token 会失效,下方逻辑做了处理
        // 由于设置密码会清空旧 token,这里立即用刚设的密码换取新 token,保证当前会话可继续编辑
        const r2 = await api('/api/notes/'+encodeURIComponent(slug)+'/unlock', { method:'POST', body: JSON.stringify({ password: val }) });
        if(r2.ok && r2.data.ok){
          state.token = r2.data.token;
          renderEditor(root, slug, state);
        }
      }
    };
    document.getElementById('applyPw2').onclick = async ()=>{
      const val = document.getElementById('newPw2').value;
      const data = await persist({ setPassword: val || '' });
      if(data){
        if(val){
          const r2 = await api('/api/notes/'+encodeURIComponent(slug)+'/unlock', { method:'POST', body: JSON.stringify({ password: val }) });
          state.hasPassword = true;
          state.token = r2.ok ? r2.data.token : null;
        } else {
          state.hasPassword = false;
          state.token = null;
        }
        state.content = area.value;
        renderEditor(root, slug, state);
      }
    };
  }

  // ---------------- FEEDBACK ----------------
  async function renderFeedback(){
    app.innerHTML = `
      ${topnavHtml('fb')}
      <div class="fb-wrap">
        <div class="fb-card">
          <div class="perforation"></div>
          <h2>问题反馈</h2>
          <p class="desc">遇到问题、有改进想法,或者只是想打个招呼?写在下面。反馈公开可见,请不要包含隐私信息。</p>
          <label>你的称呼(可选)</label>
          <input type="text" id="fbName" placeholder="匿名" />
          <label>反馈内容</label>
          <textarea id="fbMsg" placeholder="说说发生了什么…"></textarea>
          <button class="go-btn fb-submit" id="fbSubmit">提交反馈</button>
          <p class="fb-msg" id="fbMsgOk">已收到,感谢反馈!</p>
        </div>
        <div class="fb-list-wrap">
          <div class="fb-list-title">最近反馈</div>
          <div id="fbList"><p class="fb-empty">加载中…</p></div>
        </div>
      </div>
    `;
    document.getElementById('fbSubmit').onclick = submitFeedback;
    loadFeedback();
  }

  async function submitFeedback(){
    const name = document.getElementById('fbName').value.trim().slice(0,30);
    const msg = document.getElementById('fbMsg').value.trim();
    if(!msg) return;
    const r = await api('/api/feedback', { method:'POST', body: JSON.stringify({ name, message: msg }) });
    if(r.ok){
      document.getElementById('fbMsg').value='';
      document.getElementById('fbName').value='';
      const ok = document.getElementById('fbMsgOk');
      ok.style.display='block';
      setTimeout(()=> ok.style.display='none', 2500);
      loadFeedback();
    } else {
      alert('提交失败,请稍后再试');
    }
  }

  async function loadFeedback(){
    const list = document.getElementById('fbList');
    const r = await api('/api/feedback?limit=25');
    if(!r.ok || !r.data.items || r.data.items.length===0){
      list.innerHTML = '<p class="fb-empty">还没有反馈,来写第一条吧</p>';
      return;
    }
    list.innerHTML = r.data.items.map(it=>`
      <div class="fb-item">
        <div class="meta"><span>${escapeHtml(it.name)}</span><span>${timeAgo(it.createdAt)}</span></div>
        <div class="body">${escapeHtml(it.message)}</div>
      </div>
    `).join('');
  }

  // ---------------- ROUTER ----------------
  function route(){
    const hash = location.hash || '#/';
    if(hash === '#/' || hash === ''){
      renderHome();
    } else if(hash.startsWith('#/n/')){
      renderNote(decodeURIComponent(hash.slice(4)));
    } else if(hash === '#/feedback'){
      renderFeedback();
    } else {
      renderHome();
    }
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
