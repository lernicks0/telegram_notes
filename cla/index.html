<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050b14">
  <title>803 班级数字中心</title>
  <style>
    :root{--bg:#050b14;--panel:rgba(13,28,47,.76);--line:rgba(93,224,255,.2);--cyan:#58e5ff;--green:#71efb2;--gold:#ffc660;--text:#f1fbff;--muted:#96abb9}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:"Microsoft YaHei",system-ui,sans-serif;background:radial-gradient(circle at 18% 8%,rgba(21,134,190,.25),transparent 35%),radial-gradient(circle at 86% 30%,rgba(96,68,210,.22),transparent 34%),var(--bg);overflow-x:hidden}
    body:before,body:after{content:"";position:fixed;pointer-events:none}body:before{inset:0;opacity:.4;background-image:linear-gradient(rgba(88,229,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(88,229,255,.025) 1px,transparent 1px);background-size:36px 36px;mask-image:linear-gradient(#000,transparent)}body:after{width:420px;height:420px;right:-200px;top:-190px;border:1px solid rgba(88,229,255,.15);border-radius:50%;box-shadow:0 0 0 55px rgba(88,229,255,.015),0 0 0 110px rgba(88,229,255,.012)}
    .page{position:relative;width:min(1120px,calc(100% - 28px));margin:auto;padding:28px 0 40px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{display:flex;align-items:center;gap:12px}.logo{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;color:#04121b;font-size:21px;font-weight:1000;background:linear-gradient(145deg,var(--cyan),var(--green));box-shadow:0 0 35px rgba(88,229,255,.27)}.brand h1{font-size:20px;margin:0}.brand p{font-size:11px;letter-spacing:.16em;color:var(--muted);margin:5px 0 0}.badge{font-size:12px;color:var(--cyan);border:1px solid var(--line);border-radius:999px;padding:7px 11px;background:rgba(11,29,47,.6)}
    .hero{text-align:center;padding:clamp(70px,12vh,130px) 10px 52px}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.27em;color:var(--cyan)}h2{font-size:clamp(38px,8vw,76px);line-height:1.06;margin:17px 0 18px;letter-spacing:-.04em}.shine{background:linear-gradient(100deg,var(--cyan),#b4fbdf 55%,#9dafff);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{max-width:600px;margin:auto;color:var(--muted);font-size:clamp(14px,2vw,17px);line-height:1.85}
    .sites{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{position:relative;min-height:290px;padding:28px;border:1px solid var(--line);border-radius:25px;color:var(--text);text-decoration:none;overflow:hidden;background:linear-gradient(145deg,rgba(17,38,62,.86),rgba(8,19,33,.76));box-shadow:0 22px 70px rgba(0,0,0,.26);transition:.28s}.card:before{content:"";position:absolute;inset:auto -70px -100px auto;width:250px;height:250px;border-radius:50%;background:var(--glow);filter:blur(4px);opacity:.13;transition:.3s}.card:hover{transform:translateY(-7px);border-color:rgba(88,229,255,.58);box-shadow:0 30px 85px rgba(0,0,0,.4)}.card:hover:before{transform:scale(1.2);opacity:.22}.card.pk{--accent:var(--gold);--glow:#ff9f43}.card.sco{--accent:var(--cyan);--glow:#41e5ff}.card-no{color:var(--accent);font-size:12px;font-weight:900;letter-spacing:.18em}.icon{width:68px;height:68px;display:grid;place-items:center;margin:27px 0 22px;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:20px;font-size:31px;background:color-mix(in srgb,var(--accent) 9%,transparent);box-shadow:inset 0 0 30px color-mix(in srgb,var(--accent) 8%,transparent)}.card h3{font-size:29px;margin:0 0 11px}.card p{color:var(--muted);line-height:1.7;margin:0;max-width:390px}.enter{position:absolute;right:25px;bottom:23px;color:var(--accent);font-weight:900}.enter span{display:inline-grid;place-items:center;width:32px;height:32px;margin-left:8px;border-radius:50%;border:1px solid currentColor;transition:.25s}.card:hover .enter span{transform:translateX(5px);background:var(--accent);color:#07111d}
    footer{display:flex;justify-content:space-between;gap:14px;color:rgba(184,211,222,.42);font-size:12px;margin-top:30px;padding:0 3px}
    @media(max-width:700px){.sites{grid-template-columns:1fr}.hero{padding:70px 6px 38px}.card{min-height:255px}.badge{display:none}}@media(max-width:420px){.page{width:calc(100% - 18px)}.card{padding:22px}.enter{right:20px}.brand p{display:none}footer{flex-direction:column}}
  </style>
</head>
<body>
  <div class="page">
    <div class="top"><div class="brand"><div class="logo">803</div><div><h1>803 班级数字中心</h1><p>CLASS DIGITAL CENTER</p></div></div><div class="badge">● 系统在线</div></div>
    <section class="hero"><div class="eyebrow">WELCOME TO CLASS 803</div><h2>让每一次<span class="shine">挑战与进步</span><br>都有记录</h2><p>班级工具统一入口。选择要使用的系统，快速进入擂台赛或积分中心。</p></section>
    <main class="sites">
      <a class="card pk" href="https://pk.lernicks.cn"><div class="card-no">01 · PK ARENA</div><div class="icon">⚔</div><h3>803 班擂台赛</h3><p>选择对手、录入成绩、自动判断胜负，也可以查看个人成绩分析。</p><div class="enter">进入擂台赛 <span>→</span></div></a>
      <a class="card sco" href="https://sco.lernicks.cn"><div class="card-no">02 · SCORE CENTER</div><div class="icon">＋</div><h3>803 班积分中心</h3><p>记录班级积分、查看并列排名，用归档保存每个阶段的成长。</p><div class="enter">进入积分中心 <span>→</span></div></a>
    </main>
    <footer><span>cla.lernicks.cn</span><span>made by mao &amp; wang</span></footer>
  </div>
</body>
</html>
