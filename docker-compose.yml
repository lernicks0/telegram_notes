# 用法见 README「公网访问 + 数据留在本机」章节
# 使用前先在 Cloudflare Zero Trust 后台创建一个 Tunnel,拿到 token,
# 然后新建一个 .env 文件,写入:
#   TUNNEL_TOKEN=你的token
#
# 启动:docker compose up -d
# 停止:docker compose down

services:
  app:
    build: .
    container_name: telegram-notes
    restart: unless-stopped
    volumes:
      - ./data:/app/data   # 数据始终落在本机这个 data 文件夹里
    environment:
      - PORT=3000
    # 不对外映射端口也没关系,cloudflared 通过 docker 内网访问 app:3000

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: telegram-notes-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - app
