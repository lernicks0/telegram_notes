<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>803班 擂台赛</title>
<link rel="icon" type="image/png" href="logo-803-pk-tech-v3.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
    min-height:100vh;color:#fff;padding:20px;
}
.container{max-width:1100px;margin:0 auto;}
.header{text-align:center;padding:30px 0 20px;}
.header h1{
    font-size:2.2em;
    background:linear-gradient(90deg,#f7971e,#ffd200);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;margin-bottom:6px;letter-spacing:2px;
}
.header .subtitle{font-size:1em;color:#a8b2d1;letter-spacing:1px;}
.status-bar{
    background:rgba(255,255,255,0.08);border-radius:12px;
    padding:16px 24px;margin-bottom:20px;
    display:flex;align-items:center;justify-content:center;
    gap:12px;flex-wrap:wrap;
    backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);
}
.status-bar .step-indicator{font-size:1em;color:#8892b0;}
.status-bar .selected-name{
    display:inline-block;padding:6px 18px;border-radius:20px;
    font-weight:bold;font-size:1.1em;
    background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff;
    animation:pulse 1.5s infinite;
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.section-title{
    font-size:1.2em;color:#ccd6f6;margin-bottom:12px;
    padding-left:8px;border-left:4px solid #f7971e;letter-spacing:1px;
}
.name-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));
    gap:8px;margin-bottom:24px;
}
.name-btn{
    padding:11px 8px;border:2px solid rgba(255,255,255,0.15);
    border-radius:10px;background:rgba(255,255,255,0.06);
    color:#ccd6f6;font-size:0.95em;cursor:pointer;
    transition:all 0.25s ease;text-align:center;
    font-family:inherit;letter-spacing:1px;
    position:relative;overflow:hidden;
}
.name-btn:hover{
    background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.4);
    transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.3);
}
.name-btn:active{transform:scale(0.95);}
.name-btn.sel{
    background:linear-gradient(135deg,#11998e,#38ef7d)!important;
    border-color:#38ef7d!important;color:#fff!important;font-weight:bold;
    box-shadow:0 0 20px rgba(56,239,125,0.4);
}
.name-btn.done{
    opacity:0.45;pointer-events:none;cursor:default;border-style:dashed;
}
.name-btn.done::after{
    content:"✓";position:absolute;right:7px;top:5px;font-size:0.65em;opacity:0.7;
}
.pk-result-area{
    background:rgba(255,255,255,0.05);border-radius:16px;
    padding:20px 24px;margin-top:8px;
    backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);
}
.pk-list{list-style:none;display:flex;flex-wrap:wrap;gap:10px;}
.pk-item{
    background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);
    border-radius:12px;padding:10px 16px;
    display:flex;align-items:center;gap:8px;font-size:0.95em;
}
.pk-self{font-weight:bold;color:#ffd200;}
.pk-vs{color:#8892b0;font-size:0.8em;}
.pk-opp{font-weight:bold;color:#f5af19;}
.pk-del{
    margin-left:6px;width:26px;height:26px;border-radius:50%;
    border:1px solid rgba(255,80,80,0.5);background:rgba(255,80,80,0.25);
    color:#ff6060;cursor:pointer;font-size:0.8em;font-weight:bold;
    display:inline-flex;align-items:center;justify-content:center;
    transition:all 0.2s ease;line-height:1;flex-shrink:0;padding:0;
}
.pk-del:hover{background:#e74c3c;color:#fff;border-color:#e74c3c;transform:scale(1.15);}
.pk-del:active{transform:scale(0.9);}
.empty-state{text-align:center;color:#8892b0;padding:25px 0;font-size:1em;width:100%;}
.actions{
    display:flex;gap:14px;flex-wrap:wrap;margin-top:20px;justify-content:center;
}
.btn{
    padding:11px 26px;border:none;border-radius:25px;
    font-size:0.95em;cursor:pointer;font-family:inherit;font-weight:bold;
    letter-spacing:1px;transition:all 0.3s ease;
}
.btn:hover{transform:translateY(-2px);}
.btn-pri{background:linear-gradient(135deg,#f7971e,#ffd200);color:#1a1a2e;}
.btn-pri:hover{box-shadow:0 8px 25px rgba(247,151,30,0.4);}
.btn-danger{
    background:rgba(255,80,80,0.25);color:#ff5050;
    border:2px solid rgba(255,80,80,0.5);
}
.btn-danger:hover{
    background:#e74c3c;color:#fff;border-color:#e74c3c;
    box-shadow:0 6px 20px rgba(231,76,60,0.4);
}
.btn-danger:active{transform:scale(0.95);}
.btn-gray{
    background:rgba(255,255,255,0.1);color:#a8b2d1;
    border:1px solid rgba(255,255,255,0.2);font-weight:normal;
}
.btn-gray:hover{background:rgba(255,255,255,0.2);}
.btn-save{
    background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;
    border:none;font-size:1em;padding:13px 32px;
}
.btn-save:hover{box-shadow:0 8px 25px rgba(102,126,234,0.5);}
.btn-pk{
    background:linear-gradient(135deg,#f7971e,#ffd200);color:#1a1a2e;
    border:none;font-size:0.85em;padding:8px 18px;border-radius:20px;
    font-weight:bold;cursor:pointer;letter-spacing:1px;
    transition:all 0.3s ease;white-space:nowrap;
}
.btn-pk:hover{transform:scale(1.05);box-shadow:0 6px 20px rgba(247,151,30,0.4);}
.pk-count{color:#f7971e;font-weight:bold;}
.toast{
    position:fixed;top:20px;left:50%;transform:translateX(-50%);
    padding:12px 26px;border-radius:30px;font-size:0.95em;
    font-weight:bold;z-index:9999;letter-spacing:1px;
    animation:sd 0.35s ease,fo 0.35s ease 2s forwards;
    pointer-events:none;
}
.toast.ok{background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff;}
.toast.warn{background:linear-gradient(135deg,#f12711,#f5af19);color:#fff;}
.toast.nfo{background:rgba(255,255,255,0.15);color:#ccd6f6;backdrop-filter:blur(10px);}
@keyframes sd{from{top:-60px;opacity:0}to{top:20px;opacity:1}}
@keyframes fo{from{opacity:1}to{opacity:0}}

/* 弹窗 */
.dlg-overlay{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(0,0,0,0.7);display:flex;
    align-items:flex-start;justify-content:center;z-index:999;
    overflow-y:auto;padding:30px 20px;
}
.dlg-box{
    background:#1a1a2e;border:1px solid rgba(255,255,255,0.2);
    border-radius:20px;padding:28px;text-align:center;
    max-width:420px;width:90%;
}
.dlg-box h3{margin-bottom:15px;font-size:1.2em;}
.dlg-pk{font-size:1.7em;margin:16px 0;letter-spacing:2px;}
.dlg-pk .ds{color:#38ef7d;}
.dlg-pk .do{color:#f5af19;}
.dlg-note{color:#8892b0;font-size:0.85em;margin-bottom:20px;}
.dlg-btns{display:flex;gap:12px;justify-content:center;}
.dlg-btns .btn{padding:10px 22px;font-size:0.9em;}

/* 成绩输入弹窗 */
.score-dlg{
    max-width:800px!important;text-align:left!important;
    max-height:92vh;display:flex;flex-direction:column;overflow:hidden;
    padding:20px 28px!important;
}
.score-dlg h3{text-align:center;flex-shrink:0;}
.score-scroll-area{
    flex:1;overflow-y:auto;overflow-x:auto;
    min-height:0;margin:12px 0;
}
.score-dlg .dlg-btns{flex-shrink:0;}
.score-table{
    width:100%;border-collapse:collapse;margin:12px 0;
    font-size:0.88em;
}
.score-table th,.score-table td{
    padding:10px 6px;text-align:center;border:1px solid rgba(255,255,255,0.15);
}
.score-table th{
    background:rgba(102,126,234,0.25);color:#ccd6f6;font-size:0.85em;
    white-space:nowrap;
}
.score-table td{color:#e2e8f0;}
.score-table input{
    width:60px;padding:6px 4px;border:1px solid rgba(255,255,255,0.25);
    border-radius:6px;background:rgba(255,255,255,0.08);color:#fff;
    text-align:center;font-size:0.9em;font-family:inherit;
}
.score-table input:focus{
    border-color:#667eea;outline:none;
    box-shadow:0 0 8px rgba(102,126,234,0.4);
}

/* 成绩单结果 */
.score-result-box{
    background:rgba(255,255,255,0.05);border-radius:14px;
    padding:16px;margin-top:14px;
    border:1px solid rgba(255,255,255,0.12);
}
.score-result-box .pk-item.win{
    background:rgba(46,204,113,0.15);border-color:rgba(46,204,113,0.4);color:#2ecc71;
}
.score-result-box .pk-item.lose{
    background:rgba(231,76,60,0.15);border-color:rgba(231,76,60,0.4);color:#e74c3c;
}
.score-result-box .pk-item.win .pk-self,
.score-result-box .pk-item.win .pk-opp{color:#2ecc71;}

/* 已保存区域 */
.exam-name-badge{
    display:inline-block;
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:#fff;padding:6px 16px;border-radius:20px;
    font-size:0.9em;font-weight:bold;letter-spacing:1px;
}
.saved-section{
    background:rgba(255,255,255,0.04);border-radius:16px;
    padding:20px 24px;margin-top:20px;
    border:1px solid rgba(102,126,234,0.3);
}
.saved-section .section-title{border-left-color:#667eea;}
.saved-list{
    list-style:none;display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;
}
.saved-item{
    background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);
    border-radius:10px;padding:10px 16px;
    display:flex;align-items:center;gap:8px;font-size:0.9em;color:#a8b2d1;
}
.saved-del{
    margin-left:4px;width:24px;height:24px;border-radius:50%;
    border:1px solid rgba(255,80,80,0.4);background:rgba(255,80,80,0.2);
    color:#ff6060;cursor:pointer;font-size:0.75em;font-weight:bold;
    display:inline-flex;align-items:center;justify-content:center;
    transition:all 0.2s ease;flex-shrink:0;padding:0;line-height:1;
}
.saved-del:hover{background:#e74c3c;color:#fff;border-color:#e74c3c;transform:scale(1.15);}
.saved-del:active{transform:scale(0.9);}
.input-exam-name{
    width:100%;padding:12px 16px;border:2px solid rgba(255,255,255,0.2);
    border-radius:10px;background:rgba(255,255,255,0.08);color:#fff;
    font-size:1em;font-family:inherit;outline:none;
    transition:border-color 0.3s ease;margin:10px 0;
}
.input-exam-name:focus{border-color:#667eea;}
.input-exam-name::placeholder{color:#8892b0;}

/* 获胜PK对决 */
.win-section{
    background:rgba(46,204,113,0.06);border-radius:16px;
    padding:20px 24px;margin-top:20px;
    border:1px solid rgba(46,204,113,0.3);
}
.win-section .section-title{border-left-color:#2ecc71;color:#2ecc71;}
.win-section .pk-item.win{
    background:rgba(46,204,113,0.18);border-color:rgba(46,204,113,0.5);
}
.win-section .pk-item.win .pk-self,
.win-section .pk-item.win .pk-opp{color:#2ecc71;}
.win-section .pk-item.win .pk-vs{color:#27ae60;}
.win-item .score-info{font-size:0.78em;color:#8892b0;margin-left:4px;}
.paste-area{
    width:100%;min-height:120px;padding:12px 16px;
    border:2px dashed rgba(255,255,255,0.2);border-radius:12px;
    background:rgba(255,255,255,0.04);color:#ccd6f6;
    font-size:0.88em;font-family:"Consolas","Microsoft YaHei",monospace;
    resize:vertical;outline:none;line-height:1.6;
    transition:border-color 0.3s ease;
}
.paste-area:focus{border-color:#667eea;}
.paste-hint{font-size:0.82em;color:#8892b0;margin:6px 0 10px;line-height:1.6;}
.btn-paste{
    background:rgba(102,126,234,0.2);color:#8892b0;
    border:1px dashed rgba(102,126,234,0.4);font-size:0.85em;
    font-weight:normal;padding:8px 18px;
}
.btn-paste:hover{
    background:rgba(102,126,234,0.35);color:#fff;
    border-color:rgba(102,126,234,0.7);
}
.btn-import{
    background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff;
    border:none;font-size:0.9em;padding:9px 22px;
}
.btn-import:hover{box-shadow:0 6px 20px rgba(17,153,142,0.4);}

/* 获胜区考试分组 */
.win-exam-group{
    margin-bottom:16px;padding-bottom:14px;
    border-bottom:1px solid rgba(46,204,113,0.15);
}
.win-exam-group:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.win-exam-header{
    display:flex;align-items:center;gap:8px;
    margin-bottom:8px;font-size:0.92em;
}
.win-exam-header .badge{
    background:linear-gradient(135deg,#2ecc71,#27ae60);
    color:#fff;padding:4px 14px;border-radius:14px;
    font-size:0.85em;font-weight:bold;letter-spacing:1px;
}
.win-exam-header .win-count{
    color:#8892b0;font-size:0.8em;
}
.win-exam-group .pk-item.win{
    margin-left:10px;
}
.win-names-row{
    margin-top:10px;padding:10px 16px;
    background:rgba(46,204,113,0.08);border-radius:10px;
    font-size:0.88em;color:#a8b2d1;
    display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;
    border:1px solid rgba(46,204,113,0.15);
}
.win-names-label{
    color:#2ecc71;font-weight:bold;white-space:nowrap;
}
.win-names-list{
    flex:1;min-width:0;word-break:break-all;
}
.win-names-list .wn{
    color:#ffd200;font-weight:bold;
}
.btn-export-win{
    background:linear-gradient(135deg,#2ecc71,#27ae60);color:#fff;
    border:none;font-size:0.8em;padding:5px 16px;border-radius:20px;
    cursor:pointer;font-weight:bold;letter-spacing:1px;
    transition:all 0.3s ease;white-space:nowrap;
    flex-shrink:0;
}
.btn-export-win:hover{box-shadow:0 4px 15px rgba(46,204,113,0.4);transform:translateY(-1px);}

/* ============ 新版界面 ============ */
:root{
    --page:#080d19;
    --surface:#10192b;
    --surface-2:#141f34;
    --surface-3:#19263e;
    --border:#24324c;
    --border-light:#31405d;
    --text:#eef3ff;
    --muted:#8c98b1;
    --muted-2:#69758d;
    --amber:#ffad3d;
    --amber-soft:rgba(255,173,61,0.12);
    --blue:#7594ff;
    --blue-soft:rgba(117,148,255,0.13);
    --green:#4dd69f;
    --red:#ff6d7a;
    --shadow:0 22px 55px rgba(0,0,0,0.28);
}

html{scroll-behavior:smooth;}
body{
    padding:0;
    background:
        radial-gradient(circle at 84% -8%,rgba(255,173,61,0.12),transparent 30%),
        radial-gradient(circle at -5% 28%,rgba(70,105,220,0.12),transparent 32%),
        var(--page);
    color:var(--text);
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    line-height:1.5;
}

button,input,textarea{font:inherit;}
button:focus-visible,input:focus-visible,textarea:focus-visible{
    outline:3px solid rgba(255,173,61,0.3);
    outline-offset:2px;
}

.app-shell{min-height:100vh;padding-bottom:56px;}
.topbar{
    max-width:1180px;
    margin:0 auto;
    padding:18px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
    border-bottom:1px solid rgba(49,64,93,0.58);
}
.brand-block{display:flex;align-items:center;gap:11px;min-width:0;}
.brand-mark{
    width:42px;height:42px;
    display:block;object-fit:contain;flex:0 0 auto;
    filter:drop-shadow(0 8px 14px rgba(255,173,61,0.17));
}
.brand-name{font-size:0.98em;font-weight:700;letter-spacing:0.5px;}
.brand-caption{margin-top:1px;color:var(--muted-2);font-size:0.72em;letter-spacing:1px;}
.security-tools{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;}
.security-tools button{
    border:1px solid var(--border);
    border-radius:9px;
    padding:7px 11px;
    background:rgba(20,31,52,0.82);
    color:var(--muted);
    cursor:pointer;
    transition:background .2s ease,border-color .2s ease,color .2s ease;
    font-size:0.78em;
}
.security-tools button:hover{background:var(--surface-3);border-color:var(--border-light);color:var(--text);}
.security-tools button:disabled{cursor:not-allowed;opacity:.58;}
#lockStatus,#adminStatus{font-size:0.74em;color:var(--muted);}
#adminStatus{color:var(--green)!important;}

.container{max-width:1180px;padding:0 24px;margin:0 auto;}
.hero-panel{
    position:relative;
    overflow:hidden;
    margin:28px 0 18px;
    padding:30px 32px;
    border:1px solid var(--border);
    border-radius:22px;
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(320px,.72fr);
    align-items:center;
    gap:28px;
    background:linear-gradient(135deg,rgba(21,32,54,.98),rgba(12,20,36,.98));
    box-shadow:var(--shadow);
}
.hero-panel::after{
    content:"VS";
    position:absolute;right:34%;top:50%;
    transform:translate(50%,-50%);
    color:rgba(255,255,255,.025);
    font-size:9em;font-weight:900;line-height:1;
    pointer-events:none;
}
.header{text-align:left;padding:0;position:relative;z-index:1;}
.hero-kicker,.surface-eyebrow{
    color:var(--amber);
    font-size:0.7em;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
}
.header h1{
    margin:6px 0 8px;
    color:var(--text);
    background:none;
    -webkit-text-fill-color:currentColor;
    font-size:2.15em;
    line-height:1.18;
    letter-spacing:1px;
}
.header .subtitle{max-width:500px;color:var(--muted);font-size:0.9em;letter-spacing:0;}
.status-bar{
    position:relative;z-index:1;
    margin:0;padding:16px 18px;
    justify-content:flex-start;
    border:1px solid var(--border-light);
    border-radius:14px;
    background:rgba(8,13,25,.52);
    backdrop-filter:none;
    gap:11px;
}
.status-dot{
    width:9px;height:9px;border-radius:50%;flex:0 0 auto;
    background:var(--amber);box-shadow:0 0 0 5px rgba(255,173,61,.11);
}
.status-bar .step-indicator{color:var(--muted);font-size:0.9em;}
.status-bar .step-indicator strong{color:var(--text);}
.status-divider{width:1px;height:18px;background:var(--border-light);}
.file-status{margin-left:auto;color:var(--muted-2);font-size:.74em;white-space:nowrap;}
.status-bar .selected-name{
    padding:5px 12px;
    border-radius:8px;
    background:var(--amber-soft);
    color:#ffd292;
    font-size:1em;
    animation:none;
}

.dashboard-grid{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(340px,.82fr);gap:18px;align-items:start;}
.surface,.saved-section,.win-section,.pk-result-area{
    border:1px solid var(--border);
    border-radius:18px;
    background:rgba(16,25,43,.92);
    box-shadow:0 16px 38px rgba(0,0,0,.18);
}
.surface{padding:22px;}
.surface-heading{
    display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
    margin-bottom:18px;
}
.surface-heading h2{margin-top:3px;color:var(--text);font-size:1.12em;line-height:1.3;}
.surface-count{
    padding:5px 9px;border-radius:8px;
    background:var(--surface-3);color:var(--muted);
    font-size:0.76em;white-space:nowrap;
}
.pk-count{color:var(--amber);}
.section-title{border:0;padding:0;color:var(--text);font-size:1.05em;}

.name-grid{
    grid-template-columns:repeat(auto-fill,minmax(86px,1fr));
    gap:8px;margin:0;
}
.name-btn{
    min-height:41px;
    padding:8px 6px;
    border:1px solid var(--border);
    border-radius:9px;
    background:#111b2f;
    color:#b9c3d8;
    font-size:0.86em;
    letter-spacing:0;
    transition:background .18s ease,border-color .18s ease,color .18s ease,transform .18s ease;
}
.name-btn:hover{
    transform:translateY(-1px);
    background:var(--surface-3);
    border-color:var(--border-light);
    color:var(--text);
    box-shadow:none;
}
.name-btn.sel{
    background:var(--amber)!important;
    border-color:var(--amber)!important;
    color:#211400!important;
    box-shadow:0 8px 18px rgba(255,173,61,.17);
}
.name-btn.done{opacity:.34;border-style:solid;}
.name-btn.done::after{right:6px;top:3px;color:var(--green);}

.match-surface{position:sticky;top:16px;}
.pk-result-area{
    margin:0;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none;
}
.pk-list{display:grid;gap:8px;}
.pk-item{
    width:100%;min-height:48px;
    justify-content:center;
    padding:11px 12px;
    border:1px solid var(--border);
    border-radius:11px;
    background:#111b2f;
    font-size:0.88em;
}
.pk-self{color:#c9d5ff;}
.pk-vs{
    min-width:30px;padding:3px 6px;border-radius:6px;
    background:var(--amber-soft);color:#ffc773;text-align:center;
}
.pk-opp{color:#ffd292;}
.pk-del,.saved-del{
    margin-left:auto;
    border-color:rgba(255,109,122,.3);
    background:rgba(255,109,122,.1);
    color:var(--red);
}
.pk-del:hover,.saved-del:hover{transform:none;background:rgba(255,109,122,.2);border-color:rgba(255,109,122,.5);}
.saved-del:disabled,.saved-del:disabled:hover{
    cursor:not-allowed;
    opacity:.38;
    transform:none;
    background:rgba(255,109,122,.08);
    border-color:rgba(255,109,122,.18);
}
.empty-state{
    padding:36px 12px;
    border:1px dashed var(--border);
    border-radius:12px;
    color:var(--muted-2);
    font-size:0.88em;
    line-height:1.7;
}
.empty-state small{color:#59647a;}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:16px;
}
.btn{
    min-height:41px;
    padding:9px 15px;
    border:1px solid transparent;
    border-radius:10px;
    font-size:0.84em;
    font-weight:700;
    letter-spacing:0;
    transition:background .2s ease,border-color .2s ease,color .2s ease,transform .2s ease;
}
.btn:hover{transform:translateY(-1px);}
.btn-save,.btn-pri,.btn-pk{
    background:var(--amber);
    border-color:var(--amber);
    color:#211400;
    box-shadow:none;
}
.btn-save{grid-column:1 / -1;}
.btn-save:hover,.btn-pri:hover,.btn-pk:hover{box-shadow:0 9px 22px rgba(255,173,61,.16);}
.btn-save:disabled,.btn-pk:disabled{
    background:#1b263a;
    border-color:var(--border-light);
    color:#7f8aa3;
    cursor:not-allowed;
    box-shadow:none;
    transform:none;
}
.btn-gray{
    background:var(--surface-3);
    border-color:var(--border-light);
    color:#b6c0d5;
    font-weight:600;
}
.btn-gray:hover{background:#202e48;}
.btn-danger{
    background:rgba(255,109,122,.08);
    border:1px solid rgba(255,109,122,.25);
    color:#ff8b96;
}
.btn-danger:hover{background:rgba(255,109,122,.15);border-color:rgba(255,109,122,.4);color:#ffadb5;box-shadow:none;}

.saved-section,.win-section{margin-top:18px;padding:22px;}
.saved-section{border-color:var(--border);}
.saved-list{gap:8px;}
.saved-exam-block{
    margin-bottom:18px;
    padding-bottom:18px;
    border-bottom:1px solid var(--border);
}
.saved-exam-block:last-child{margin-bottom:0;padding-bottom:0;border-bottom:0;}
.saved-exam-head{display:flex;align-items:center;gap:9px;margin-bottom:11px;flex-wrap:wrap;}
.saved-exam-time{color:var(--muted-2);font-size:.76em;}
.saved-exam-count{color:#9eaff0;font-size:.78em;}
.saved-score-list{margin-top:7px;}
.saved-item{
    border:1px solid var(--border);
    border-radius:9px;
    background:#111b2f;
    color:var(--muted);
}
.saved-self{color:#c9d5ff;font-weight:700;}
.saved-vs{color:var(--muted-2);font-size:.78em;}
.saved-opp{color:#ffd292;font-weight:700;}
.saved-section .pk-item.win{background:rgba(77,214,159,.08);border-color:rgba(77,214,159,.24);}
.saved-section .pk-item.lose{background:rgba(255,109,122,.07);border-color:rgba(255,109,122,.2);}
.exam-name-badge,.win-exam-header .badge{
    border-radius:8px;
    background:var(--blue-soft);
    color:#b9c8ff;
    font-size:0.82em;
}
.btn-pk{border-radius:9px;font-size:0.78em;padding:7px 13px;}
.btn-analysis{
    border:1px solid rgba(89,220,255,.32);border-radius:9px;padding:7px 13px;
    background:rgba(33,116,150,.16);color:#8feaff;font-size:.78em;font-weight:700;
    cursor:pointer;transition:all .2s ease;white-space:nowrap;
}
.btn-analysis:hover{transform:translateY(-1px);border-color:#59dcff;background:rgba(33,116,150,.28);}
.btn-analysis:disabled{cursor:not-allowed;opacity:.42;transform:none;}
.analysis-dlg{max-width:620px!important;text-align:left!important;}
.analysis-controls{display:grid;grid-template-columns:1fr auto;gap:8px;margin:14px 0;}
.analysis-name-input{width:100%;padding:11px 13px;border:1px solid var(--border-light);border-radius:9px;background:#0b1628;color:var(--text);outline:none;}
.analysis-name-input:focus{border-color:#59dcff;box-shadow:0 0 0 3px rgba(89,220,255,.1);}
.analysis-result{min-height:115px;max-height:48vh;overflow-y:auto;padding:16px;border:1px solid var(--border);border-radius:12px;background:rgba(5,12,24,.58);color:#dce8ff;line-height:1.8;white-space:pre-wrap;font-size:.92em;}
.analysis-note{display:flex;gap:8px;align-items:flex-start;margin:12px 0;color:var(--muted-2);font-size:.78em;line-height:1.6;}
.analysis-generate{margin-top:12px;width:100%;}
.analysis-tag{display:inline-block;margin-bottom:9px;padding:4px 8px;border-radius:99px;background:rgba(77,214,159,.1);color:var(--green);font-size:.72em;}
.win-section{border-color:rgba(77,214,159,.24);background:rgba(15,32,37,.82);}
.win-section .pk-item.win,.score-result-box .pk-item.win{

}
.score-result-box .pk-item.lose{background:rgba(255,109,122,.08);border-color:rgba(255,109,122,.22);color:var(--red);}
.win-names-row{border-color:rgba(77,214,159,.2);background:rgba(77,214,159,.06);}
.win-names-label{color:var(--green);}
.win-names-list .wn{color:#ffd292;}
.btn-export-win,.btn-import{background:var(--green);color:#071f17;box-shadow:none;}

/* 弹窗也使用同一套风格 */
.dlg-overlay{

    padding:28px 16px;
}
.dlg-box{

}
.dlg-box h3{font-size:1.18em;color:var(--text);}
.dlg-note{color:var(--muted);}

.dlg-pk .ds{color:#c9d5ff;}

.dlg-btns{gap:8px;}
.help-dlg{max-width:640px!important;text-align:left!important;}

.help-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.help-step{padding:13px 14px;border:1px solid var(--border);border-radius:12px;background:#0c1526;line-height:1.65;font-size:.84em;color:var(--muted);}
.help-step strong{display:block;margin-bottom:4px;color:var(--text);font-size:1.04em;}
.help-tip{margin-top:12px;padding:12px 14px;border:1px solid rgba(255,173,61,.25);border-radius:12px;background:rgba(255,173,61,.07);color:#ffd292;font-size:.82em;line-height:1.65;}

.input-exam-name,
.score-table input{

    background:#0c1526!important;

}

}

.score-table{border-collapse:separate;border-spacing:0;font-size:0.82em;}
.score-table th,.score-table td{border:0;border-bottom:1px solid var(--border);padding:10px 7px;}

.score-name-cell{color:#dbe3f5!important;font-weight:700;}

.paste-area{border-color:var(--border-light);background:#0c1526;color:var(--text);}

.gate-overlay{

    background:linear-gradient(135deg,#050a13,#0a1425);
}
.gate-card{

    background:linear-gradient(145deg,#121d31,#0d1628);

    text-align:left;
}
.gate-mark{
    width:82px;height:82px;

}
.gate-kicker{color:var(--amber);font-size:.7em;font-weight:700;letter-spacing:2px;}
.gate-card h2{margin:6px 0 6px;color:var(--text);font-size:1.55em;}
.gate-caption{margin-bottom:25px;color:var(--muted);font-size:.86em;}

}

    user-select:none;
}

.toast{border-radius:10px;box-shadow:0 16px 35px rgba(0,0,0,.3);}

.toast.nfo{background:#17243a;color:#c7d1e5;}

</head>
<body>

    <header class="topbar">
        <div class="brand-block">
            <img class="brand-mark" src="logo-803-pk-tech-v3.png" alt="803 班擂台赛 Logo">

                <div class="brand-name">803 班擂台赛</div>

<script>
// ============ 全局变量 ============
var NAMES = [];

// ============ 验证门 ============
var gateAnswer = 0;
function newGateQuestion(){
    var left = 3 + Math.floor(Math.random() * 17);
    var right = 2 + Math.floor(Math.random() * 13);
    gateAnswer = left + right;
    document.getElementById('gateQuestion').textContent = left + ' ＋ ' + right + ' ＝ ?';
}

// ============ 记住认证状态 ============
var GATE_PASSED_KEY = '803_pk_gate_passed';
var LOCKED_STATE_KEY = '803_pk_page_locked';
var LOCK_STATE_URL = '/lock-state.json';

// 检查是否已认证
if(localStorage.getItem(GATE_PASSED_KEY) === '1'){
    document.getElementById('gateOverlay').style.display = 'none';
} else {
    newGateQuestion();
    document.getElementById('gateOverlay').style.display = 'flex';
}

document.getElementById('gateBtn').onclick = function(){
    var input = document.getElementById('gateAnswer');
    var err = document.getElementById('gateError');
    if(Number(input.value.trim()) === gateAnswer){
        localStorage.setItem(GATE_PASSED_KEY, '1');
        document.getElementById('gateOverlay').style.display = 'none';
    } else {
        err.style.display = 'block';
        input.value = '';
        newGateQuestion();
        input.focus();
    }
};
document.getElementById('gateAnswer').addEventListener('keydown', function(e){
    if(e.key === 'Enter') document.getElementById('gateBtn').click();
});
document.getElementById('gateAnswer').focus();

var KEY = '803_pk_data_v3';
var curSelf = null;
var pkList = [];
var pendingOpp = null;
var savedExams = [];     // [{name, records:[], time, scoreResults:null}]
var winResults = null;   // 当前显示的获胜结果
var currentAccount = null;

// ============ Toast ============
function toast(msg, type){
    var c = document.getElementById('toastContainer');
    var d = document.createElement('div');
    d.className = 'toast ' + (type||'nfo');
    d.textContent = msg;
    c.appendChild(d);
    setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); }, 2500);
}

// ============ 数据持久化（JSON文件，自动读写）============
var DATA_URL = 'data.json';
var SAVE_URL = 'save.json';
var NAMES_URL = 'names.json';

async function loadData(){
    try{
        var stamp = '?_t=' + Date.now();
        var responses = await Promise.all([fetch(DATA_URL + stamp, {credentials:'same-origin'}), fetch(NAMES_URL + stamp, {credentials:'same-origin'})]);
        if(!responses[0].ok || !responses[1].ok) throw new Error(responses[0].status === 401 || responses[1].status === 401 ? '请先登录班级账号' : 'no data');
        var data = await responses[0].json();
        var roster = await responses[1].json();
        NAMES = Array.isArray(roster.names) ? roster.names : [];
        pkList = data.pkList || [];
        savedExams = data.savedExams || [];
        refreshAll();
        applyLockUI();
        var el = document.getElementById('fileStatus');
        if(el) el.textContent = '📁 数据已自动加载';
    }catch(e){
        // 暂时读取不到数据时只显示空页面，不能让未登录用户误写服务器文件。
        pkList = []; savedExams = [];
        var el = document.getElementById('fileStatus');
        if(el) el.textContent = '⚠️ 数据暂时无法读取';
    }
}

async function saveData(){
    try{
        var data = JSON.stringify({pkList:pkList, savedExams:savedExams});
        var res = await fetch(SAVE_URL, {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            credentials: 'same-origin',
            body: data
        });
        var result = {};
        try{ result = await res.json(); }catch(e){}
        if(!res.ok) throw Object.assign(new Error(result.message || '保存失败'), {status:res.status});
        pkList = result.pkList || [];
        savedExams = result.savedExams || [];
        refreshAll();
        return true;
    }catch(e){
        toast(e.message || '保存失败，请稍后重试', 'warn');
        if(e.status === 401 && window.ClassAccount) window.ClassAccount.open();
        await loadData();
        return false;
    }
}

function onNameClick(idx){
    var name = NAMES[idx];

        toast('请先登录班级账号', 'warn');

        refreshAll();

        pendingOpp = name;
        showDialog(name);

// ============ 确认弹窗 ============
function showDialog(opp){
    var c = document.getElementById('dlgContainer');
    c.innerHTML =
        '<div class="dlg-overlay" onclick="if(event.target===this)closeDialog()">'+
            '<div class="dlg-box">'+
                '<h3>确认PK对决？</h3>'+
                '<div class="dlg-pk">~<span class="ds">'+curSelf+'</span> PK <span class="do">'+opp+'</span>~</div>'+
                '<p class="dlg-note">确认后将保存本次对决记录</p>'+
                '<div class="dlg-btns">'+
                    '<button class="btn btn-gray" onclick="closeDialog()">取消</button>'+
                    '<button class="btn btn-pri" onclick="doConfirm()">✅ 确认对决</button>'+
                '</div>'+
            '</div>'+
        '</div>';
}
function closeDialog(){ pendingOpp = null; document.getElementById('dlgContainer').innerHTML = ''; }
function doConfirm(){
    var opp = pendingOpp;
    var nextRecord = {self:curSelf, opponent:opp, time:new Date().toLocaleString('zh-CN')};
    var replaced = false;
    for(var i=0;i<pkList.length;i++){
        if(pkList[i].self === curSelf){ pkList[i] = nextRecord; replaced = true; break; }
    }
    if(!replaced) pkList.push(nextRecord);
    saveData();
    curSelf = (!isAdmin && currentAccount) ? currentAccount.name : null; pendingOpp = null;
    document.getElementById('dlgContainer').innerHTML = '';
    refreshAll();
    toast('~'+nextRecord.self+' PK '+nextRecord.opponent+'~ 对决已确认！', 'ok');
}

// ============ 获胜区渲染（按考试分类） ============
var _winExportMap = {}; // examIdx -> {examName, names:[], namesText}

function renderWinSection(){
    var section = document.getElementById('winSection');
    var content = document.getElementById('winContent');
    _winExportMap = {};
    
    // 按考试收集获胜者
    var examWins = []; // [{examIdx, examName, wins:[]}]
    for(var i=0;i<savedExams.length;i++){
        var exam = savedExams[i];
        if(!exam.scoreResults) continue;
        var wins = [];
        for(var j=0;j<exam.scoreResults.length;j++){
            var sr = exam.scoreResults[j];
            if(sr.winner === sr.pk.self){
                wins.push({
                    pk: sr.pk,
                    pkTotal: sr.pkSelfTotal,
                    oppTotal: sr.pkOppTotal,
                    tieBreak: sr.tieBreak || false
                });
            }
        }
        if(wins.length > 0){
            examWins.push({examIdx:i, examName:exam.name, wins:wins});
        }
    }

    if(examWins.length === 0){
        section.style.display = 'none';
        return;
    }
    section.style.display = 'block';

    var h = '';
    for(var e=0;e<examWins.length;e++){
        var group = examWins[e];
        var examIdx = group.examIdx;
        
        // 收集获胜人员（去重）
        var winNames = [];
        for(var w=0;w<group.wins.length;w++){
            var n = group.wins[w].pk.self;
            if(winNames.indexOf(n) === -1) winNames.push(n);
        }
        // 存入导出映射
        _winExportMap[examIdx] = {
            examName: group.examName,
            names: winNames,
            namesText: winNames.join('\n')
        };
        
        var namesHtml = '';
        for(var n=0;n<winNames.length;n++){
            namesHtml += '<span class="wn">'+winNames[n]+'</span>';
            if(n < winNames.length - 1) namesHtml += '、';
        }
        
        h += '<div class="win-exam-group">'+
            '<div class="win-exam-header">'+
                '<span class="badge">📝 '+group.examName+'</span>'+
                '<span class="win-count">'+group.wins.length+' 组获胜 | '+winNames.length+' 人获胜</span>'+
            '</div>'+
            '<ul class="pk-list">';
        for(var w=0;w<group.wins.length;w++){
            var win = group.wins[w];
            var tb = win.tieBreak ? ' <span class="score-info">(小分胜出: 语文+数学领先)</span>' : '';
            h += '<li class="pk-item win">'+
                '<span>🎉</span>'+
                '<span class="pk-self">'+win.pk.self+'</span>'+
                '<span class="pk-vs">('+win.pkTotal+') PK ('+win.oppTotal+')</span>'+
                '<span class="pk-opp">'+win.pk.opponent+'</span>'+tb+
            '</li>';
        }
        h += '</ul>'+
            '<div class="win-names-row">'+
                '<span class="win-names-label">🏅 获胜人员：</span>'+
                '<span class="win-names-list">'+namesHtml+'</span>'+
                '<button class="btn-export-win" onclick="exportWinNames('+examIdx+')">📋 导出名单</button>'+
            '</div>'+
            '</div>';
    }
    content.innerHTML = h;
}

// ============ 导出获胜名单 ============
function exportWinNames(examIdx){
    var data = _winExportMap[examIdx];
    if(!data) return;
    var examName = data.examName;
    var content = '考试：'+examName+'\n获胜人员：\n'+data.namesText;
    var blob = new Blob(['\uFEFF'+content], {type:'text/plain;charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = examName + '_获胜名单.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
    toast('已导出「'+examName+'」获胜名单', 'ok');
}

// ============ 导入粘贴的表格数据 ============
function importPastedScores(){
    var textarea = document.getElementById('pasteArea');
    if(!textarea){ return; }
    var raw = textarea.value.trim();
    if(!raw){ toast('请先在文本框中粘贴成绩表格', 'warn'); return; }

    // 按行分割
    var lines = raw.split(/[\r\n]+/);
    if(lines.length === 0){ toast('未识别到表格数据', 'warn'); return; }

    var imported = 0;
    var skipped = 0;

    for(var i=0;i<lines.length;i++){
        var line = lines[i].trim();
        if(!line) continue;

        // 按Tab分割（Excel粘贴格式），也兼容逗号或空格
        var cols = line.split('\t');
        if(cols.length < 2) continue;

        // 去除首尾空格
        for(var c=0;c<cols.length;c++){ cols[c] = cols[c].trim(); }

        var name = cols[0];
        // 检查是否是表头行（包含"姓名""科目""语文"等关键词）
        if(isHeaderRow(name, cols)){
            skipped++;
            continue;
        }

        // 检查该名字是否在本次参与PK的学生中
        var allInputs = document.querySelectorAll('.score-inp[data-name="'+name+'"]');
        if(allInputs.length === 0){
            // 名字不在参与列表中，跳过
            skipped++;
            continue;
        }

        // 按顺序填入各科分数（从第2列开始）
        for(var s=0;s<SUBJECTS.length;s++){
            var colIdx = s + 1; // 第0列是名字，第1列开始是成绩
            if(colIdx >= cols.length) break;
            var val = cols[colIdx];
            var numVal = parseFloat(val);
            if(isNaN(numVal)) continue;

            // 找到对应输入框
            var inp = document.querySelector('.score-inp[data-name="'+name+'"][data-subj="'+SUBJECTS[s]+'"]');
            if(inp){
                inp.value = numVal;
                calcRowTotal(inp);
            }
        }
        imported++;
    }

    if(imported > 0){
        toast('成功导入 '+imported+' 人的成绩'+(skipped>0?'（跳过 '+skipped+' 行）':''), 'ok');
    } else {
        toast('未能导入任何成绩，请检查表格格式', 'warn');
    }
}

// ============ 判断是否为表头行 ============
function isHeaderRow(name, cols){
    var headerKeywords = ['姓名','名字','学生','语文','数学','英语','科学','文综','道法','历史','总分','科目'];
    // 检查第一列是否包含关键词
    for(var i=0;i<headerKeywords.length;i++){
        if(name.indexOf(headerKeywords[i]) !== -1) return true;
    }
    // 检查其他列是否包含多个科目关键词（表头特征）
    var matchCount = 0;
    for(var c=1;c<cols.length && c<=SUBJECTS.length+1;c++){
        for(var k=0;k<headerKeywords.length;k++){
            if(cols[c].indexOf(headerKeywords[k]) !== -1){
                matchCount++;
                break;
            }
        }
    }
    if(matchCount >= 2) return true;
    return false;
}

// 实时计算个人总分
function calcRowTotal(inp){
    var name = inp.getAttribute('data-name');
    var row = inp.closest('tr');
    var inputs = row.querySelectorAll('.score-inp');
    var total = 0;
    for(var i=0;i<inputs.length;i++){
        var v = parseFloat(inputs[i].value);
        if(!isNaN(v)) total += v;
    }
    var spanId = 'total_' + name.replace(/[^a-zA-Z\u4e00-\u9fa5]/g,'_');
    var span = document.getElementById(spanId);
    if(span) span.textContent = total;
}

// 收集分数并执行PK比对
function doScorePK(examIdx){
    // 再检查一次，防止绕过“开始PK”按钮直接保存成绩。
    if(!isAdmin){
        closeScoreDialog();
        toast('保存成绩失败：需要管理员权限', 'warn');
        updatePkActionPermissionUI();
        return;
    }
    var exam = savedExams[examIdx];
    
    // 收集所有学生的分数
    var scoreData = {};
    var allInputs = document.querySelectorAll('.score-inp');
    var hasEmpty = false;
    for(var i=0;i<allInputs.length;i++){
        var inp = allInputs[i];
        var name = inp.getAttribute('data-name');
        var subj = inp.getAttribute('data-subj');
        var val = parseFloat(inp.value);
        if(isNaN(val) || inp.value.trim() === ''){ hasEmpty = true; }
        if(!scoreData[name]) scoreData[name] = {};
        scoreData[name][subj] = isNaN(val) ? 0 : val;
    }
    
    if(hasEmpty){
        toast('请填写所有学生的所有科目分数！', 'warn'); return;
    }

    // 构建成绩总分映射: name -> {total, chinese, math, subjects:{}}
    var stuScores = {};
    for(var name in scoreData){
        var scores = scoreData[name];
        var total = 0;
        for(var s=0;s<SUBJECTS.length;s++){
            total += (scores[SUBJECTS[s]] || 0);
        }
        stuScores[name] = {
            total: total,
            chinese: scores['语文'] || 0,
            math: scores['数学'] || 0,
            subjects: scores
        };
    }

    // 逐条比对PK
    var results = [];
    for(var i=0;i<exam.records.length;i++){
        var pk = exam.records[i];
        var selfScore = stuScores[pk.self];
        var oppScore = stuScores[pk.opponent];
        
        var winner = null;
        var tieBreak = false;
        
        if(selfScore.total > oppScore.total){
            winner = pk.self;
        } else if(selfScore.total < oppScore.total){
            winner = pk.opponent;
        } else {
            // 总分相同，比较语文+数学
            var selfCM = selfScore.chinese + selfScore.math;
            var oppCM = oppScore.chinese + oppScore.math;
            if(selfCM > oppCM){
                winner = pk.self;
                tieBreak = true;
            } else if(selfCM < oppCM){
                winner = pk.opponent;
                tieBreak = true;
            }
            // 如果语数也一样，则平局，不标记胜负
        }
        
        results.push({
            pk: pk,
            pkSelfTotal: selfScore.total,
            pkOppTotal: oppScore.total,
            winner: winner,
            tieBreak: tieBreak
        });
    }

    // 保存成绩和结果
    exam.scoreData = scoreData;
    exam.scoreResults = results;
    saveData();
    closeScoreDialog();
    refreshAll();
    
    // 统计胜负
    var winCount = 0; var loseCount = 0; var drawCount = 0;
    for(var j=0;j<results.length;j++){
        if(results[j].winner === null) drawCount++;
        else if(results[j].winner === results[j].pk.self) winCount++;
        else loseCount++;
    }
    toast('PK结果：PK人获胜'+winCount+'组 | 败北'+loseCount+'组 | 平局'+drawCount+'组', 'ok');
}

// ============ 锁定/管理员 ============
var isLocked = localStorage.getItem(LOCKED_STATE_KEY) === '1';
var isAdmin = false;
var isSavingLockState = false;
var isLoadingLockState = false;

async function loadSharedLockState(){
    if(isSavingLockState || isLoadingLockState) return;
    isLoadingLockState = true;
    try{
        var res = await fetch(LOCK_STATE_URL + '?_t=' + Date.now(), {cache:'no-store'});
        if(!res.ok) throw new Error('load lock state failed');
        var data = await res.json();
        var sharedLocked = data.locked === true;
        localStorage.setItem(LOCKED_STATE_KEY, sharedLocked ? '1' : '0');
        if(sharedLocked !== isLocked){
            isLocked = sharedLocked;
            applyLockUI();
        }
    }catch(e){
        // 网络断开时继续使用这台设备上一次记住的状态。
    }finally{
        isLoadingLockState = false;
    }
}

// 所有人都能查看；同一场考试的同一位同学只会真正调用一次 AI。
var analysisExamIndex = -1;

                '<div id="analysisTag"></div>'+
                '<div id="analysisResult" class="analysis-result">请先输入姓名，再点击“查看分析”。</div>'+
                '<button id="analysisGenerate" class="btn btn-pri analysis-generate" style="display:none" onclick="generateAnalysis()">✨ 首次生成分析（本场每人仅一次）</button>'+

function currentAnalysisName(){
    var input = document.getElementById('analysisName');
    var name = input ? input.value.trim() : '';
    var exam = savedExams[analysisExamIndex];
    if(!name || !exam || !exam.scoreData || !exam.scoreData[name]){
        toast('请输入本场考试中完整、正确的姓名', 'warn');
        return '';
    }
    return name;
}

async function analysisRequest(url, options){
    var res = await fetch(url, options);
    var data;
    try{ data = await res.json(); }catch(e){ data = {message:'服务器返回的数据无法读取'}; }
    if(!res.ok) throw new Error(data.message || '分析请求失败');
    return data;
}

async function lookupAnalysis(){
    var name = currentAnalysisName();
    if(!name) return;
    var box = document.getElementById('analysisResult');
    var tag = document.getElementById('analysisTag');
    var button = document.getElementById('analysisGenerate');
    box.textContent = '正在查找已经保存的分析…'; tag.innerHTML = ''; button.style.display = 'none';
    try{
        var data = await analysisRequest('/analysis.json?examIndex='+analysisExamIndex+'&studentName='+encodeURIComponent(name));
        if(data.cached && data.analysis){
            showAnalysisResult(data.analysis);
        }else{
            box.textContent = '这位同学还没有生成过本场考试的分析。点击下面按钮后会调用一次 DeepSeek，并把结果保存下来，之后任何人查看都不会再次调用。';
            button.style.display = 'block';
        }
    }catch(error){ box.textContent = error.message; toast(error.message, 'warn'); }
}

async function generateAnalysis(){
    var name = currentAnalysisName();
    if(!name) return;
    var box = document.getElementById('analysisResult');
    var button = document.getElementById('analysisGenerate');
    button.disabled = true; button.textContent = 'AI 正在分析，请稍等…';
    box.textContent = 'DeepSeek 正在阅读匿名分数并整理建议，通常需要几秒钟。请不要关闭窗口。';
    try{
        var data = await analysisRequest('/analyze.json', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body:JSON.stringify({examIndex:analysisExamIndex, studentName:name})
        });
        showAnalysisResult(data.analysis);
        toast(data.cached ? '已读取保存过的分析' : '分析完成并已保存', 'ok');
    }catch(error){
        box.textContent = error.message;
        button.disabled = false; button.textContent = '重新尝试首次生成';
        toast(error.message, 'warn');
    }
}

function showAnalysisResult(item){
    document.getElementById('analysisTag').innerHTML = '<span class="analysis-tag">✓ 已保存 · 以后查看不再调用 AI</span>';
    document.getElementById('analysisResult').textContent = item.text || '暂无分析内容';
    var button = document.getElementById('analysisGenerate');
    button.style.display = 'none'; button.disabled = false;
}

async function saveSharedLockState(nextLocked){
    var res = await fetch(LOCK_STATE_URL, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        credentials:'same-origin',
        body:JSON.stringify({locked:nextLocked})
    });
    if(!res.ok) throw new Error('save lock state failed');
    var data = await res.json();
    if(!data.ok) throw new Error('save lock state failed');
}

function updateAdminAuthUI(){
    var adminBtn = document.getElementById('adminBtn');
    var adminStatus = document.getElementById('adminStatus');
    adminBtn.style.display = 'flex';
    adminStatus.style.display = isAdmin ? 'inline' : 'none';
}

function updateLockPermissionUI(){
    var lockBtn = document.getElementById('lockBtn');
    if(isSavingLockState){
        lockBtn.disabled = true;
        lockBtn.innerHTML = '⏳ 同步中...';
        lockBtn.title = '正在同步所有设备的锁定状态';
    } else if(!isAdmin){
        lockBtn.disabled = true;
        lockBtn.innerHTML = '🔒 仅管理员可锁定';
        lockBtn.title = '只有管理员可以锁定页面';
        lockBtn.style.borderColor = 'rgba(255,255,255,0.15)';
        lockBtn.style.color = '#8892b0';
    } else if(isLocked){
        lockBtn.disabled = false;
        lockBtn.innerHTML = '🔓 解除锁定';
        lockBtn.title = '管理员点击即可解除锁定';
        lockBtn.style.borderColor = 'rgba(255,80,80,0.4)';
        lockBtn.style.color = '#ff5050';
    } else {
        lockBtn.disabled = false;
        lockBtn.innerHTML = '🔒 锁定页面';
        lockBtn.title = '管理员点击即可锁定页面';
        lockBtn.style.borderColor = 'rgba(255,255,255,0.15)';
        lockBtn.style.color = '#8892b0';
    }
}

async function toggleLock(){
    if(!isAdmin){
        toast('只有管理员可以锁定页面', 'warn');
        updateLockPermissionUI();
        return;
    }
    if(isSavingLockState) return;

    var previousLocked = isLocked;
    var nextLocked = !isLocked;
    isSavingLockState = true;
    isLocked = nextLocked;
    localStorage.setItem(LOCKED_STATE_KEY, nextLocked ? '1' : '0');
    applyLockUI();
    try{
        await saveSharedLockState(nextLocked);
        toast(nextLocked ? '所有设备已锁定' : '所有设备已解除锁定', nextLocked ? 'warn' : 'ok');
    }catch(e){
        isLocked = previousLocked;
        localStorage.setItem(LOCKED_STATE_KEY, previousLocked ? '1' : '0');
        toast('同步失败，锁定状态没有改变', 'warn');
    }finally{
        isSavingLockState = false;
        applyLockUI();
    }
}

function applyLockUI(){
    var lockBtn = document.getElementById('lockBtn');
    var status = document.getElementById('lockStatus');
    var allBtns = document.querySelectorAll('.name-btn, .go-btn, .icon-btn, .btn, .btn-pri, .btn-danger, .btn-gray, .btn-save, .btn-pk, .btn-analysis, .btn-import, .btn-export-win, .btn-paste, .pk-del, .saved-del, #donateBtn, #lockBtn');
    
    if(isLocked && !isAdmin){
        status.textContent = '⛔ 页面已锁定';
        status.style.color = '#ff5050';
        // 禁用比赛操作按钮，账号入口仍可使用。
        for(var i=0;i<allBtns.length;i++){
            if(allBtns[i] && allBtns[i].id !== 'lockBtn'){
                allBtns[i].disabled = true;
                allBtns[i].style.pointerEvents = 'none';
                allBtns[i].style.opacity = '0.4';
            }
        }
        // 验证门和班级账号框要一直能输入。
        var inputs = document.querySelectorAll('input:not(#gateAnswer):not(.ca-field), textarea:not(.ca-field), select:not(.ca-field)');
        for(var j=0;j<inputs.length;j++){
            inputs[j].disabled = true;
        }
    } else {
        status.textContent = isLocked ? '🔒 页面已锁定 · 管理员可操作' : '';
        status.style.color = isLocked ? '#ffb13b' : '';
        // 未锁定或当前是管理员时，恢复全部操作。
        for(var i=0;i<allBtns.length;i++){
            if(allBtns[i]){
                allBtns[i].disabled = false;
                allBtns[i].style.pointerEvents = '';
                allBtns[i].style.opacity = '';
            }
        }
        var inputs = document.querySelectorAll('input:not(#gateAnswer):not(.ca-field), textarea:not(.ca-field), select:not(.ca-field)');
        for(var j=0;j<inputs.length;j++){
            inputs[j].disabled = false;
        }
    }
    updateAdminAuthUI();
    updateLockPermissionUI();
    updateSavePermissionUI();
    updatePkActionPermissionUI();
    updateDeletePermissionUI();
    updateAnalysisPermissionUI();
}

function applyAccount(account){
    currentAccount = account || null;
    isAdmin = !!(currentAccount && currentAccount.isAdmin);
    curSelf = currentAccount && !isAdmin ? currentAccount.name : null;
    pendingOpp = null;
    applyLockUI();
    refreshAll();
}

window.addEventListener('class-account-change', function(event){
    var nextAccount = event.detail ? event.detail.account : null;
    applyAccount(nextAccount);
    if(nextAccount) loadData();
    else { NAMES = []; pkList = []; savedExams = []; refreshAll(); }
});

if(window.ClassAccount){
    window.ClassAccount.ready.then(function(account){ applyAccount(account); if(account) loadData(); });
}

applyLockUI();

setInterval(loadSharedLockState, 3000);
