<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>803班 考试分数擂台赛</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
    min-height:100vh;color:#fff;padding:20px;
}
.container{max-width:1100px;margin:0 auto;}
.header{text-align:center;padding:30px 0 20px;}
.header h1{
    font-size:2.2em;
    background:linear-gradient(90deg,#f7971e,#ffd200);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;margin-bottom:6px;letter-spacing:2px;
}
.header .subtitle{font-size:1em;color:#a8b2d1;letter-spacing:1px;}
.status-bar{
    background:rgba(255,255,255,0.08);border-radius:12px;
    padding:16px 24px;margin-bottom:20px;
    display:flex;align-items:center;justify-content:center;
    gap:12px;flex-wrap:wrap;
    backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);
}
.status-bar .step-indicator{font-size:1em;color:#8892b0;}
.status-bar .selected-name{
    display:inline-block;padding:6px 18px;border-radius:20px;
    font-weight:bold;font-size:1.1em;
    background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff;
    animation:pulse 1.5s infinite;
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.section-title{
    font-size:1.2em;color:#ccd6f6;margin-bottom:12px;
    padding-left:8px;border-left:4px solid #f7971e;letter-spacing:1px;
}
.name-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));
    gap:8px;margin-bottom:24px;
}
.name-btn{
    padding:11px 8px;border:2px solid rgba(255,255,255,0.15);
    border-radius:10px;background:rgba(255,255,255,0.06);
    color:#ccd6f6;font-size:0.95em;cursor:pointer;
    transition:all 0.25s ease;text-align:center;
    font-family:inherit;letter-spacing:1px;
    position:relative;overflow:hidden;
}
.name-btn:hover{
    background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.4);
    transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.3);
}
.name-btn:active{transform:scale(0.95);}
.name-btn.sel{
    background:linear-gradient(135deg,#11998e,#38ef7d)!important;
    border-color:#38ef7d!important;color:#fff!important;font-weight:bold;
    box-shadow:0 0 20px rgba(56,239,125,0.4);
}
.name-btn.done{
    opacity:0.45;pointer-events:none;cursor:default;border-style:dashed;
}
.name-btn.done::after{
    content:"✓";position:absolute;right:7px;top:5px;font-size:0.65em;opacity:0.7;
}
.pk-result-area{
    background:rgba(255,255,255,0.05);border-radius:16px;
    padding:20px 24px;margin-top:8px;
    backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);
}
.pk-list{list-style:none;display:flex;flex-wrap:wrap;gap:10px;}
.pk-item{
    background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);
    border-radius:12px;padding:10px 16px;
    display:flex;align-items:center;gap:8px;font-size:0.95em;
}
.pk-self{font-weight:bold;color:#ffd200;}
.pk-vs{color:#8892b0;font-size:0.8em;}
.pk-opp{font-weight:bold;color:#f5af19;}
.pk-del{
    margin-left:6px;width:26px;height:26px;border-radius:50%;
    border:1px solid rgba(255,80,80,0.5);background:rgba(255,80,80,0.25);
    color:#ff6060;cursor:pointer;font-size:0.8em;font-weight:bold;
    display:inline-flex;align-items:center;justify-content:center;
    transition:all 0.2s ease;line-height:1;flex-shrink:0;padding:0;
}
.pk-del:hover{background:#e74c3c;color:#fff;border-color:#e74c3c;transform:scale(1.15);}
.pk-del:active{transform:scale(0.9);}
.empty-state{text-align:center;color:#8892b0;padding:25px 0;font-size:1em;width:100%;}
.actions{
    display:flex;gap:14px;flex-wrap:wrap;margin-top:20px;justify-content:center;
}
.btn{
    padding:11px 26px;border:none;border-radius:25px;
    font-size:0.95em;cursor:pointer;font-family:inherit;font-weight:bold;
    letter-spacing:1px;transition:all 0.3s ease;
}
.btn:hover{transform:translateY(-2px);}
.btn-pri{background:linear-gradient(135deg,#f7971e,#ffd200);color:#1a1a2e;}
.btn-pri:hover{box-shadow:0 8px 25px rgba(247,151,30,0.4);}
.btn-danger{
    background:rgba(255,80,80,0.25);color:#ff5050;
    border:2px solid rgba(255,80,80,0.5);
}
.btn-danger:hover{
    background:#e74c3c;color:#fff;border-color:#e74c3c;
    box-shadow:0 6px 20px rgba(231,76,60,0.4);
}
.btn-danger:active{transform:scale(0.95);}
.btn-gray{
    background:rgba(255,255,255,0.1);color:#a8b2d1;
    border:1px solid rgba(255,255,255,0.2);font-weight:normal;
}
.btn-gray:hover{background:rgba(255,255,255,0.2);}
.btn-save{
    background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;
    border:none;font-size:1em;padding:13px 32px;
}
.btn-save:hover{box-shadow:0 8px 25px rgba(102,126,234,0.5);}
.btn-pk{
    background:linear-gradient(135deg,#f7971e,#ffd200);color:#1a1a2e;
    border:none;font-size:0.85em;padding:8px 18px;border-radius:20px;
    font-weight:bold;cursor:pointer;letter-spacing:1px;
    transition:all 0.3s ease;white-space:nowrap;
}
.btn-pk:hover{transform:scale(1.05);box-shadow:0 6px 20px rgba(247,151,30,0.4);}
.pk-count{color:#f7971e;font-weight:bold;}
.toast{
    position:fixed;top:20px;left:50%;transform:translateX(-50%);
    padding:12px 26px;border-radius:30px;font-size:0.95em;
    font-weight:bold;z-index:9999;letter-spacing:1px;
    animation:sd 0.35s ease,fo 0.35s ease 2s forwards;
    pointer-events:none;
}
.toast.ok{background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff;}
.toast.warn{background:linear-gradient(135deg,#f12711,#f5af19);color:#fff;}
.toast.nfo{background:rgba(255,255,255,0.15);color:#ccd6f6;backdrop-filter:blur(10px);}
@keyframes sd{from{top:-60px;opacity:0}to{top:20px;opacity:1}}
@keyframes fo{from{opacity:1}to{opacity:0}}

/* 弹窗 */
.dlg-overlay{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(0,0,0,0.7);display:flex;
    align-items:flex-start;justify-content:center;z-index:999;
    overflow-y:auto;padding:30px 20px;
}
.dlg-box{
    background:#1a1a2e;border:1px solid rgba(255,255,255,0.2);
    border-radius:20px;padding:28px;text-align:center;
    max-width:420px;width:90%;
}
.dlg-box h3{margin-bottom:15px;font-size:1.2em;}
.dlg-pk{font-size:1.7em;margin:16px 0;letter-spacing:2px;}
.dlg-pk .ds{color:#38ef7d;}
.dlg-pk .do{color:#f5af19;}
.dlg-note{color:#8892b0;font-size:0.85em;margin-bottom:20px;}
.dlg-btns{display:flex;gap:12px;justify-content:center;}
.dlg-btns .btn{padding:10px 22px;font-size:0.9em;}

/* 成绩输入弹窗 */
.score-dlg{
    max-width:800px!important;text-align:left!important;
    max-height:92vh;display:flex;flex-direction:column;overflow:hidden;
    padding:20px 28px!important;
}
.score-dlg h3{text-align:center;flex-shrink:0;}
.score-scroll-area{
    flex:1;overflow-y:auto;overflow-x:auto;
    min-height:0;margin:12px 0;
}
.score-dlg .dlg-btns{flex-shrink:0;}
.score-table{
    width:100%;border-collapse:collapse;margin:12px 0;
    font-size:0.88em;
}
.score-table th,.score-table td{
    padding:10px 6px;text-align:center;border:1px solid rgba(255,255,255,0.15);
}
.score-table th{
    background:rgba(102,126,234,0.25);color:#ccd6f6;font-size:0.85em;
    white-space:nowrap;
}
.score-table td{color:#e2e8f0;}
.score-table input{
    width:60px;padding:6px 4px;border:1px solid rgba(255,255,255,0.25);
    border-radius:6px;background:rgba(255,255,255,0.08);color:#fff;
    text-align:center;font-size:0.9em;font-family:inherit;
}
.score-table input:focus{
    border-color:#667eea;outline:none;
    box-shadow:0 0 8px rgba(102,126,234,0.4);
}

/* 成绩单结果 */
.score-result-box{
    background:rgba(255,255,255,0.05);border-radius:14px;
    padding:16px;margin-top:14px;
    border:1px solid rgba(255,255,255,0.12);
}
.score-result-box .pk-item.win{
    background:rgba(46,204,113,0.15);border-color:rgba(46,204,113,0.4);color:#2ecc71;
}
.score-result-box .pk-item.lose{
    background:rgba(231,76,60,0.15);border-color:rgba(231,76,60,0.4);color:#e74c3c;
}
.score-result-box .pk-item.win .pk-self,
.score-result-box .pk-item.win .pk-opp{color:#2ecc71;}

/* 已保存区域 */
.exam-name-badge{
    display:inline-block;
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:#fff;padding:6px 16px;border-radius:20px;
    font-size:0.9em;font-weight:bold;letter-spacing:1px;
}
.saved-section{
    background:rgba(255,255,255,0.04);border-radius:16px;
    padding:20px 24px;margin-top:20px;
    border:1px solid rgba(102,126,234,0.3);
}
.saved-section .section-title{border-left-color:#667eea;}
.saved-list{
    list-style:none;display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;
}
.saved-item{
    background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);
    border-radius:10px;padding:10px 16px;
    display:flex;align-items:center;gap:8px;font-size:0.9em;color:#a8b2d1;
}
.saved-del{
    margin-left:4px;width:24px;height:24px;border-radius:50%;
    border:1px solid rgba(255,80,80,0.4);background:rgba(255,80,80,0.2);
    color:#ff6060;cursor:pointer;font-size:0.75em;font-weight:bold;
    display:inline-flex;align-items:center;justify-content:center;
    transition:all 0.2s ease;flex-shrink:0;padding:0;line-height:1;
}
.saved-del:hover{background:#e74c3c;color:#fff;border-color:#e74c3c;transform:scale(1.15);}
.saved-del:active{transform:scale(0.9);}
.input-exam-name{
    width:100%;padding:12px 16px;border:2px solid rgba(255,255,255,0.2);
    border-radius:10px;background:rgba(255,255,255,0.08);color:#fff;
    font-size:1em;font-family:inherit;outline:none;
    transition:border-color 0.3s ease;margin:10px 0;
}
.input-exam-name:focus{border-color:#667eea;}
.input-exam-name::placeholder{color:#8892b0;}

/* 获胜PK对决 */
.win-section{
    background:rgba(46,204,113,0.06);border-radius:16px;
    padding:20px 24px;margin-top:20px;
    border:1px solid rgba(46,204,113,0.3);
}
.win-section .section-title{border-left-color:#2ecc71;color:#2ecc71;}
.win-section .pk-item.win{
    background:rgba(46,204,113,0.18);border-color:rgba(46,204,113,0.5);
}
.win-section .pk-item.win .pk-self,
.win-section .pk-item.win .pk-opp{color:#2ecc71;}
.win-section .pk-item.win .pk-vs{color:#27ae60;}
.win-item .score-info{font-size:0.78em;color:#8892b0;margin-left:4px;}
.paste-area{
    width:100%;min-height:120px;padding:12px 16px;
    border:2px dashed rgba(255,255,255,0.2);border-radius:12px;
    background:rgba(255,255,255,0.04);color:#ccd6f6;
    font-size:0.88em;font-family:"Consolas","Microsoft YaHei",monospace;
    resize:vertical;outline:none;line-height:1.6;
    transition:border-color 0.3s ease;
}
.paste-area:focus{border-color:#667eea;}
.paste-hint{font-size:0.82em;color:#8892b0;margin:6px 0 10px;line-height:1.6;}
.btn-paste{
    background:rgba(102,126,234,0.2);color:#8892b0;
    border:1px dashed rgba(102,126,234,0.4);font-size:0.85em;
    font-weight:normal;padding:8px 18px;
}
.btn-paste:hover{
    background:rgba(102,126,234,0.35);color:#fff;
    border-color:rgba(102,126,234,0.7);
}
.btn-import{
    background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff;
    border:none;font-size:0.9em;padding:9px 22px;
}
.btn-import:hover{box-shadow:0 6px 20px rgba(17,153,142,0.4);}

/* 获胜区考试分组 */
.win-exam-group{
    margin-bottom:16px;padding-bottom:14px;
    border-bottom:1px solid rgba(46,204,113,0.15);
}
.win-exam-group:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.win-exam-header{
    display:flex;align-items:center;gap:8px;
    margin-bottom:8px;font-size:0.92em;
}
.win-exam-header .badge{
    background:linear-gradient(135deg,#2ecc71,#27ae60);
    color:#fff;padding:4px 14px;border-radius:14px;
    font-size:0.85em;font-weight:bold;letter-spacing:1px;
}
.win-exam-header .win-count{
    color:#8892b0;font-size:0.8em;
}
.win-exam-group .pk-item.win{
    margin-left:10px;
}
.win-names-row{
    margin-top:10px;padding:10px 16px;
    background:rgba(46,204,113,0.08);border-radius:10px;
    font-size:0.88em;color:#a8b2d1;
    display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;
    border:1px solid rgba(46,204,113,0.15);
}
.win-names-label{
    color:#2ecc71;font-weight:bold;white-space:nowrap;
}
.win-names-list{
    flex:1;min-width:0;word-break:break-all;
}
.win-names-list .wn{
    color:#ffd200;font-weight:bold;
}
.btn-export-win{
    background:linear-gradient(135deg,#2ecc71,#27ae60);color:#fff;
    border:none;font-size:0.8em;padding:5px 16px;border-radius:20px;
    cursor:pointer;font-weight:bold;letter-spacing:1px;
    transition:all 0.3s ease;white-space:nowrap;
    flex-shrink:0;
}
.btn-export-win:hover{box-shadow:0 4px 15px rgba(46,204,113,0.4);transform:translateY(-1px);}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>⚔️ 803班 考试分数擂台赛 ⚔️</h1>
        <p class="subtitle">考前对决 · 考后比分 · 谁能笑到最后？</p>
    </div>

    <div class="status-bar" id="statusBar">
        <span class="step-indicator" id="stepText">👆 第一步：请选择<strong>你自己</strong>的名字</span>
    </div>

    <div class="section-title">📋 全班名单（共52人）</div>
    <div class="name-grid" id="nameGrid"></div>

    <div class="pk-result-area">
        <div class="section-title">
            🏆 已确认的PK对决
            <span style="font-weight:normal;font-size:0.8em;color:#8892b0;">
                （共 <span class="pk-count" id="pkCount">0</span> 组）
            </span>
        </div>
        <ul class="pk-list" id="pkList">
            <li class="empty-state">还没有PK对决，快来发起挑战吧！💪</li>
        </ul>
    </div>

    <div class="actions">
        <button class="btn btn-gray" onclick="doReset()">🔄 重新选择</button>
        <button class="btn btn-danger" onclick="doClearAll()">🗑️ 清除全部记录</button>
        <button class="btn btn-save" onclick="openSaveDialog()">💾 保存PK记录</button>
    </div>

    <div class="saved-section" id="savedSection">
        <div class="section-title">📦 已封存的PK记录</div>
        <div id="savedContent">
            <p class="empty-state">尚未保存任何考试PK记录</p>
        </div>
    </div>

    <!-- 获胜结果区 -->
    <div class="win-section" id="winSection" style="display:none;">
        <div class="section-title">🎉 获胜PK对决</div>
        <div id="winContent"></div>
    </div>
</div>

<!-- 锁定/管理员工具栏 -->
<div style="max-width:1100px;margin:8px auto 0;padding:0 4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
    <button id="lockBtn" style="padding:6px 14px;border-radius:20px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:#8892b0;font-size:0.8em;cursor:pointer;font-family:inherit;transition:all 0.2s;display:flex;align-items:center;gap:5px;" onclick="showLockDialog()">🔓 锁定页面</button>
    <button id="adminBtn" style="padding:6px 14px;border-radius:20px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:#667eea;font-size:0.8em;cursor:pointer;font-family:inherit;transition:all 0.2s;display:flex;align-items:center;gap:5px;display:none;" onclick="showAdminDialog()">🔑 管理员认证</button>
    <span id="lockStatus" style="font-size:0.78em;color:#8892b0;"></span>
    <span id="adminStatus" style="font-size:0.78em;color:#2ecc71;display:none;">✅ 管理员模式</span>
</div>

<!-- 验证门 -->
<div id="gateOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;">
    <div style="background:rgba(255,255,255,0.06);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.12);border-radius:24px;padding:40px 36px;max-width:400px;width:90%;text-align:center;">
        <div style="font-size:48px;margin-bottom:12px;">🔒</div>
        <h2 style="color:#ccd6f6;margin:0 0 6px;font-size:1.3em;">803班 擂台赛</h2>
        <p style="color:#8892b0;font-size:0.95em;margin-bottom:24px;line-height:1.6;">回答问题即可进入</p>
        <p style="color:#f5af19;font-size:1.1em;font-weight:bold;margin-bottom:16px;">我们班班长是谁？</p>
        <input type="text" id="gateAnswer" placeholder="请输入答案" autocomplete="off" style="width:100%;padding:12px 16px;border:2px solid rgba(255,255,255,0.2);border-radius:12px;background:rgba(255,255,255,0.08);color:#fff;font-size:1em;font-family:inherit;outline:none;transition:border-color 0.3s;text-align:center;" />
        <p id="gateError" style="color:#ff5050;font-size:0.85em;margin-top:10px;display:none;">答案不正确，请再想想</p>
        <button id="gateBtn" style="margin-top:20px;width:100%;padding:12px;border:none;border-radius:12px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:1em;font-weight:bold;cursor:pointer;letter-spacing:1px;transition:all 0.3s;font-family:inherit;" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='none'">验证 →</button>
    </div>
</div>

<div id="toastContainer"></div>
<div id="dlgContainer"></div>

<script>
// ============ 全局变量 ============
var NAMES = [
    "鲍思言","边元","陈树","陈泽皓","董书言","董宥辰","杜亚修","范沈杨",
    "郭皓宇","贾荞宇","卢硕","吕子墨","毛思棋","毛梓鑫","缪奕稔","濮梓睿",
    "齐陈廷","钱思远","沈珵夏","舒嘉宇","童岂凡","王韩润","王梓驿","翁晨淏",
    "严炜轩","叶景然","张嘉睿","章辰怿","郑凯瑞","方奕涵","葛紫兮","黄梓萱",
    "姜思琪","金玺","匡修琪","李乐水","林芮羽","刘杭","鲁昱莹","吕偲萌",
    "吕家臻","邵子涵","王若霏","王芸旻","王珣苹","王桭玥","王梓诺","闻语歆",
    "吴逸暄","徐悦珂","周芷萱","朱沚昕"
];

// ============ 验证门 ============
// 三种答案都可以通过。这里只保存答案的哈希值，不直接保存答案。
var GATE_HASHES = [
    'd594caee6bb4c6221540ee24859f4a26b075725f62c1fa6b673e9e0674b68775',
    '7fe3d9ae179a1e211d1a7a226118910b9550dc1f9e7a0930d61f0683376d812e',
    '0dc03415048f864c84a8f95928f3536ed5adb1381b1a73297fa4b490a0ab0d95'
];

async function sha256(str){
    var buf = new TextEncoder().encode(str);
    var hash = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
}

// ============ 数据持久化（JSON文件，自动读写）============
var DATA_URL = 'data.json';
var SAVE_URL = 'save.json';

async function loadData(){
    try{
        var res = await fetch(DATA_URL + '?_t=' + Date.now());
        if(!res.ok) throw new Error('no data');
        var data = await res.json();
        pkList = data.pkList || [];
        savedExams = data.savedExams || [];
        refreshAll();
        var el = document.getElementById('fileStatus');
        if(el) el.textContent = '📁 数据已自动加载';
    }catch(e){
        // 没有数据文件时，新建数据
        pkList = []; savedExams = [];
        saveData();
        var el = document.getElementById('fileStatus');
        if(el) el.textContent = '📁 已创建新数据文件';
    }
}

async function saveData(){
    try{
        var data = JSON.stringify({pkList:pkList, savedExams:savedExams});
        var res = await fetch(SAVE_URL, {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: data
        });
        if(!res.ok) throw new Error('save failed');
    }catch(e){
        // 保存失败时回退到下载
        var blob = new Blob([JSON.stringify({pkList:pkList, savedExams:savedExams}, null, 2)], {type:'application/json'});
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = '803班擂台赛数据.json';
        document.body.appendChild(a); a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
    }
}

var _winExportMap = {}; // examIdx -> {examName, names:[], namesText}

function renderWinSection(){
    var section = document.getElementById('winSection');
    var content = document.getElementById('winContent');
    _winExportMap = {};
    
    // 按考试收集获胜者
    var examWins = []; // [{examIdx, examName, wins:[]}]
    for(var i=0;i<savedExams.length;i++){
        var exam = savedExams[i];
        if(!exam.scoreResults) continue;
        var wins = [];
        for(var j=0;j<exam.scoreResults.length;j++){
            var sr = exam.scoreResults[j];
            if(sr.winner === sr.pk.self){
                wins.push({
                    pk: sr.pk,
                    pkTotal: sr.pkSelfTotal,
                    oppTotal: sr.pkOppTotal,
                    tieBreak: sr.tieBreak || false
                });
            }
        }
        if(wins.length > 0){
            examWins.push({examIdx:i, examName:exam.name, wins:wins});
        }
    }

    if(examWins.length === 0){
        section.style.display = 'none';
        return;
    }
    section.style.display = 'block';

    var h = '';
    for(var e=0;e<examWins.length;e++){
        var group = examWins[e];
        var examIdx = group.examIdx;
        
        // 收集获胜人员（去重）
        var winNames = [];
        for(var w=0;w<group.wins.length;w++){
            var n = group.wins[w].pk.self;
            if(winNames.indexOf(n) === -1) winNames.push(n);
        }
        // 存入导出映射
        _winExportMap[examIdx] = {
            examName: group.examName,
            names: winNames,
            namesText: winNames.join('\n')
        };
        
        var namesHtml = '';
        for(var n=0;n<winNames.length;n++){
            namesHtml += '<span class="wn">'+winNames[n]+'</span>';
            if(n < winNames.length - 1) namesHtml += '、';
        }
        
        h += '<div class="win-exam-group">'+
            '<div class="win-exam-header">'+
                '<span class="badge">📝 '+group.examName+'</span>'+
                '<span class="win-count">'+group.wins.length+' 组获胜 | '+winNames.length+' 人获胜</span>'+
            '</div>'+
            '<ul class="pk-list">';
        for(var w=0;w<group.wins.length;w++){
            var win = group.wins[w];
            var tb = win.tieBreak ? ' <span class="score-info">(小分胜出: 语文+数学领先)</span>' : '';
            h += '<li class="pk-item win">'+
                '<span>🎉</span>'+
                '<span class="pk-self">'+win.pk.self+'</span>'+
                '<span class="pk-vs">('+win.pkTotal+') PK ('+win.oppTotal+')</span>'+
                '<span class="pk-opp">'+win.pk.opponent+'</span>'+tb+
            '</li>';
        }
        h += '</ul>'+
            '<div class="win-names-row">'+
                '<span class="win-names-label">🏅 获胜人员：</span>'+
                '<span class="win-names-list">'+namesHtml+'</span>'+
                '<button class="btn-export-win" onclick="exportWinNames('+examIdx+')">📋 导出名单</button>'+
            '</div>'+
            '</div>';
    }
    content.innerHTML = h;
}

// ============ 导入粘贴的表格数据 ============
function importPastedScores(){
    var textarea = document.getElementById('pasteArea');
    if(!textarea){ return; }
    var raw = textarea.value.trim();
    if(!raw){ toast('请先在文本框中粘贴成绩表格', 'warn'); return; }

    // 按行分割
    var lines = raw.split(/[\r\n]+/);
    if(lines.length === 0){ toast('未识别到表格数据', 'warn'); return; }

    var imported = 0;
    var skipped = 0;

    for(var i=0;i<lines.length;i++){
        var line = lines[i].trim();
        if(!line) continue;

        // 按Tab分割（Excel粘贴格式），也兼容逗号或空格
        var cols = line.split('\t');
        if(cols.length < 2) continue;

        // 去除首尾空格
        for(var c=0;c<cols.length;c++){ cols[c] = cols[c].trim(); }

        var name = cols[0];
        // 检查是否是表头行（包含"姓名""科目""语文"等关键词）
        if(isHeaderRow(name, cols)){
            skipped++;
            continue;
        }

        // 检查该名字是否在本次参与PK的学生中
        var allInputs = document.querySelectorAll('.score-inp[data-name="'+name+'"]');
        if(allInputs.length === 0){
            // 名字不在参与列表中，跳过
            skipped++;
            continue;
        }

        // 按顺序填入各科分数（从第2列开始）
        for(var s=0;s<SUBJECTS.length;s++){
            var colIdx = s + 1; // 第0列是名字，第1列开始是成绩
            if(colIdx >= cols.length) break;
            var val = cols[colIdx];
            var numVal = parseFloat(val);
            if(isNaN(numVal)) continue;

            // 找到对应输入框
            var inp = document.querySelector('.score-inp[data-name="'+name+'"][data-subj="'+SUBJECTS[s]+'"]');
            if(inp){
                inp.value = numVal;
                calcRowTotal(inp);
            }
        }
        imported++;
    }

    if(imported > 0){
        toast('成功导入 '+imported+' 人的成绩'+(skipped>0?'（跳过 '+skipped+' 行）':''), 'ok');
    } else {
        toast('未能导入任何成绩，请检查表格格式', 'warn');
    }
}

// ============ 判断是否为表头行 ============
function isHeaderRow(name, cols){
    var headerKeywords = ['姓名','名字','学生','语文','数学','英语','科学','文综','道法','历史','总分','科目'];
    // 检查第一列是否包含关键词
    for(var i=0;i<headerKeywords.length;i++){
        if(name.indexOf(headerKeywords[i]) !== -1) return true;
    }
    // 检查其他列是否包含多个科目关键词（表头特征）
    var matchCount = 0;
    for(var c=1;c<cols.length && c<=SUBJECTS.length+1;c++){
        for(var k=0;k<headerKeywords.length;k++){
            if(cols[c].indexOf(headerKeywords[k]) !== -1){
                matchCount++;
                break;
            }
        }
    }
    if(matchCount >= 2) return true;
    return false;
}

// 实时计算个人总分
function calcRowTotal(inp){
    var name = inp.getAttribute('data-name');
    var row = inp.closest('tr');
    var inputs = row.querySelectorAll('.score-inp');
    var total = 0;
    for(var i=0;i<inputs.length;i++){
        var v = parseFloat(inputs[i].value);
        if(!isNaN(v)) total += v;
    }
    var spanId = 'total_' + name.replace(/[^a-zA-Z\u4e00-\u9fa5]/g,'_');
    var span = document.getElementById(spanId);
    if(span) span.textContent = total;
}

// 收集分数并执行PK比对
function doScorePK(examIdx){
    var exam = savedExams[examIdx];
    
    // 收集所有学生的分数
    var scoreData = {};
    var allInputs = document.querySelectorAll('.score-inp');
    var hasEmpty = false;
    for(var i=0;i<allInputs.length;i++){
        var inp = allInputs[i];
        var name = inp.getAttribute('data-name');
        var subj = inp.getAttribute('data-subj');
        var val = parseFloat(inp.value);
        if(isNaN(val) || inp.value.trim() === ''){ hasEmpty = true; }
        if(!scoreData[name]) scoreData[name] = {};
        scoreData[name][subj] = isNaN(val) ? 0 : val;
    }
    
    if(hasEmpty){
        toast('请填写所有学生的所有科目分数！', 'warn'); return;
    }

    // 构建成绩总分映射: name -> {total, chinese, math, subjects:{}}
    var stuScores = {};
    for(var name in scoreData){
        var scores = scoreData[name];
        var total = 0;
        for(var s=0;s<SUBJECTS.length;s++){
            total += (scores[SUBJECTS[s]] || 0);
        }
        stuScores[name] = {
            total: total,
            chinese: scores['语文'] || 0,
            math: scores['数学'] || 0,
            subjects: scores
        };
    }

    // 逐条比对PK
    var results = [];
    for(var i=0;i<exam.records.length;i++){
        var pk = exam.records[i];
        var selfScore = stuScores[pk.self];
        var oppScore = stuScores[pk.opponent];
        
        var winner = null;
        var tieBreak = false;
        
        if(selfScore.total > oppScore.total){
            winner = pk.self;
        } else if(selfScore.total < oppScore.total){
            winner = pk.opponent;
        } else {
            // 总分相同，比较语文+数学
            var selfCM = selfScore.chinese + selfScore.math;
            var oppCM = oppScore.chinese + oppScore.math;
            if(selfCM > oppCM){
                winner = pk.self;
                tieBreak = true;
            } else if(selfCM < oppCM){
                winner = pk.opponent;
                tieBreak = true;
            }
            // 如果语数也一样，则平局，不标记胜负
        }
        
        results.push({
            pk: pk,
            pkSelfTotal: selfScore.total,
            pkOppTotal: oppScore.total,
            winner: winner,
            tieBreak: tieBreak
        });
    }

    // 保存成绩和结果
    exam.scoreData = scoreData;
    exam.scoreResults = results;
    saveData();
    closeScoreDialog();
    refreshAll();
    
    // 统计胜负
    var winCount = 0; var loseCount = 0; var drawCount = 0;
    for(var j=0;j<results.length;j++){
        if(results[j].winner === null) drawCount++;
        else if(results[j].winner === results[j].pk.self) winCount++;
        else loseCount++;
    }
    toast('PK结果：PK人获胜'+winCount+'组 | 败北'+loseCount+'组 | 平局'+drawCount+'组', 'ok');
}

// ============ 锁定/管理员 ============
var LOCK_HASH = 'e23599c762762c9906c147c9c56e42484bf125cdee5837eb5d49b3ae9c2e072e';
var ADMIN_HASH = 'f1d5c9e75d4fc18900e439cad1a255960a4b4ae965991d59415bb9aff0a9eb7f';
var isLocked = false;
var isAdmin = false;

function showLockDialog(){
    var c = document.getElementById('dlgContainer');
    c.innerHTML =
        '<div class="dlg-overlay" onclick="if(event.target===this)closeDialog()">'+
            '<div class="dlg-box">'+
                '<h3>'+(!isLocked?'🔒 锁定页面':'🔓 解锁页面')+'</h3>'+
                '<p class="dlg-note">'+(!isLocked?'锁定后所有操作将被禁用':'输入密码解锁')+'</p>'+
                '<input type="password" id="lockPwInput" placeholder="输入密码" style="width:100%;padding:10px;border:1px solid rgba(255,255,255,0.2);border-radius:8px;background:rgba(255,255,255,0.08);color:#fff;font-size:1em;text-align:center;outline:none;font-family:inherit;" />'+
                '<p id="lockPwErr" style="color:#ff5050;font-size:0.85em;margin-top:8px;display:none;">密码错误</p>'+
                '<div class="dlg-btns" style="margin-top:16px;">'+
                    '<button class="btn btn-gray" onclick="closeDialog()">取消</button>'+
                    '<button class="btn btn-pri" onclick="applyLock()">确定</button>'+
                '</div>'+
            '</div>'+
        '</div>';
    document.getElementById('lockPwInput').focus();
}

async function applyLock(){
    var val = document.getElementById('lockPwInput').value;
    var hash = await sha256(val);
    if(hash === LOCK_HASH){
        closeDialog();
        isLocked = !isLocked;
        applyLockUI();
    } else {
        document.getElementById('lockPwErr').style.display = 'block';
    }
}

function applyLockUI(){
    var lockBtn = document.getElementById('lockBtn');
    var adminBtn = document.getElementById('adminBtn');
    var status = document.getElementById('lockStatus');
    var allBtns = document.querySelectorAll('.name-btn, .go-btn, .icon-btn, .btn, .btn-pri, .btn-danger, .btn-gray, .btn-save, .btn-pk, .btn-import, .btn-export-win, .btn-paste, #lockBtn');
    
    if(isLocked){
        lockBtn.innerHTML = '🔒 已锁定';
        lockBtn.style.borderColor = 'rgba(255,80,80,0.4)';
        lockBtn.style.color = '#ff5050';
        status.textContent = '⛔ 页面已锁定';
        status.style.color = '#ff5050';
        // 禁用所有按钮（除了 adminBtn 和 lockBtn）
        for(var i=0;i<allBtns.length;i++){
            if(allBtns[i] && allBtns[i].id !== 'lockBtn'){
                allBtns[i].disabled = true;
                allBtns[i].style.pointerEvents = 'none';
                allBtns[i].style.opacity = '0.4';
            }
        }
        // 禁用输入框
        var inputs = document.querySelectorAll('input, textarea, select');
        for(var j=0;j<inputs.length;j++){
            inputs[j].disabled = true;
        }
        // 显示管理员按钮
        adminBtn.style.display = 'flex';
        document.getElementById('adminStatus').style.display = 'none';
    } else {
        lockBtn.innerHTML = '🔓 锁定页面';
        lockBtn.style.borderColor = 'rgba(255,255,255,0.15)';
        lockBtn.style.color = '#8892b0';
        status.textContent = '';
        // 如果没管理员认证，恢复禁用
        if(!isAdmin){
            for(var i=0;i<allBtns.length;i++){
                if(allBtns[i]){
                    allBtns[i].disabled = false;
                    allBtns[i].style.pointerEvents = '';
                    allBtns[i].style.opacity = '';
                }
            }
            var inputs = document.querySelectorAll('input, textarea, select');
            for(var j=0;j<inputs.length;j++){
                inputs[j].disabled = false;
            }
        }
        adminBtn.style.display = 'none';
        document.getElementById('adminStatus').style.display = 'none';
    }
}

function showAdminDialog(){
    var c = document.getElementById('dlgContainer');
    c.innerHTML =
        '<div class="dlg-overlay" onclick="if(event.target===this)closeDialog()">'+
            '<div class="dlg-box">'+
                '<h3>🔑 管理员认证</h3>'+
                '<p class="dlg-note">输入管理员密钥解锁编辑权限</p>'+
                '<input type="password" id="adminKeyInput" placeholder="输入管理员密钥" style="width:100%;padding:10px;border:1px solid rgba(255,255,255,0.2);border-radius:8px;background:rgba(255,255,255,0.08);color:#fff;font-size:1em;text-align:center;outline:none;font-family:inherit;" />'+
                '<p id="adminKeyErr" style="color:#ff5050;font-size:0.85em;margin-top:8px;display:none;">密钥错误</p>'+
                '<div class="dlg-btns" style="margin-top:16px;">'+
                    '<button class="btn btn-gray" onclick="closeDialog()">取消</button>'+
                    '<button class="btn btn-pri" onclick="applyAdmin()">验证</button>'+
                '</div>'+
            '</div>'+
        '</div>';
}

async function applyAdmin(){
    var val = document.getElementById('adminKeyInput').value;
    var hash = await sha256(val);
    if(hash === ADMIN_HASH){
        closeDialog();
        isAdmin = true;
        isLocked = false;
        localStorage.setItem(ADMIN_AUTHED_KEY, '1');
        // 恢复所有操作
        var allBtns = document.querySelectorAll('.name-btn, .go-btn, .icon-btn, .btn, .btn-pri, .btn-danger, .btn-gray, .btn-save, .btn-pk, .btn-import, .btn-export-win, .btn-paste, #lockBtn');
        for(var i=0;i<allBtns.length;i++){
            if(allBtns[i]){
                allBtns[i].disabled = false;
                allBtns[i].style.pointerEvents = '';
                allBtns[i].style.opacity = '';
            }
        }
        var inputs = document.querySelectorAll('input, textarea, select');
        for(var j=0;j<inputs.length;j++){
            inputs[j].disabled = false;
        }
        // 更新 UI
        document.getElementById('lockBtn').innerHTML = '🔓 锁定页面';
        document.getElementById('lockBtn').style.borderColor = 'rgba(255,255,255,0.15)';
        document.getElementById('lockBtn').style.color = '#8892b0';
        document.getElementById('lockStatus').textContent = '';
        document.getElementById('adminBtn').style.display = 'none';
        document.getElementById('adminStatus').style.display = 'inline';
        toast('✅ 管理员模式已激活', 'ok');
    } else {
        document.getElementById('adminKeyErr').style.display = 'block';
    }
}
// 先显示空界面
refreshAll();
// 异步加载数据（加载完成后自动 refresh）
loadData();

// 添加文件状态栏（在 status-bar 下方显示）
setTimeout(function(){
    var container = document.querySelector('.status-bar:last-of-type');
    if(container){
        var bar = document.createElement('div');
        bar.style.cssText = 'text-align:center;padding:10px;color:#8892b0;font-size:0.9em;';
        bar.innerHTML = '<span id="fileStatus">💾 正在加载数据...</span>';
        container.parentNode.insertBefore(bar, container.nextSibling);
    }
}, 100);
</script>
